<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meta Master: OPTCG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080808;--surf:#0d0d0d;--card:#111111;--brd:rgba(255,255,255,.07);
  --text:#f0f0f0;--dim:#7a8299;--acc:#F400A1;--acc-dim:rgba(244,0,161,.15);
  --g1:#00e87a;--g2:#6ee87a;--y:#fbbf24;--o:#f97316;--r:#ef4444;--rr:#dc2626;--info:#00E5FF;
  --font-head:'Syne',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;line-height:1.5;background-image:radial-gradient(ellipse 60% 40% at 50% 0%,rgba(244,0,161,.04),transparent);
  background-image:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(244,0,161,.05),transparent);position:relative;overflow-x:hidden}
a{color:var(--acc)}
kbd{background:var(--card);border:0.5px solid var(--brd);padding:1px 6px;border-radius:3px;font-family:var(--font-mono);font-size:11px}
button,select,textarea{font-family:var(--font-body);cursor:pointer}
select{background:var(--card);color:var(--text);border:1px solid var(--brd);border-radius:8px;padding:9px 12px;font-size:13px;outline:none;width:100%;transition:border .15s}
select:hover,select:focus{border-color:var(--acc)}
textarea{font-family:var(--font-mono);resize:vertical}
input[type=checkbox]{accent-color:var(--acc);cursor:pointer;width:14px;height:14px}

/* Layout */
.wrap{max-width:1100px;margin:0 auto;padding:1.5rem 1.25rem 3rem}

/* Header */
.hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2rem;flex-wrap:wrap;gap:12px}
.hdr-title{font-family:var(--font-head);font-size:20px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--text);line-height:1;transition:opacity .15s}.hdr-title:hover{opacity:.7}
.hdr-sub{font-size:11px;color:var(--dim);margin-top:4px;font-family:var(--font-mono)}
.hdr-badge{background:var(--card);border:1px solid #3a4060;border-radius:20px;padding:5px 14px;font-size:12px;color:#b0bbd8;font-family:var(--font-mono);font-weight:600}
.hdr-ds{width:auto!important;min-width:160px;font-size:12px!important;padding:5px 10px!important}



/* ═══════════════════════════════════════════════════════
   META TRENDS
   ═══════════════════════════════════════════════════════ */
.trends-hero{text-align:center;padding:20px 0 12px}
.trends-hero-title{font-family:var(--font-head);font-size:32px;font-weight:800;
  color:var(--text);letter-spacing:.04em}
.trends-hero-sub{font-size:13px;color:#9aa8cc;margin-top:4px;font-weight:600}
.trends-compare-lbl{font-size:11px;color:#666;font-family:var(--font-mono);margin-top:6px}

.trends-sort-bar{display:flex;gap:8px;margin:14px 0;align-items:center;flex-wrap:wrap}
.trends-sort-lbl{font-size:12px;color:#b0bbd8;font-weight:700;font-family:var(--font-head);
  letter-spacing:.06em;text-transform:uppercase;margin-right:4px}

/* Highlights row */
.trends-highlights{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
@media(max-width:600px){.trends-highlights{grid-template-columns:1fr}}
.trends-panel{background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:14px 16px;
  background:linear-gradient(135deg,rgba(255,255,255,.025),rgba(255,255,255,0))}
.trends-panel-title{font-family:var(--font-head);font-size:13px;font-weight:800;
  letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}

/* Trend rows */
.trend-row{display:grid;grid-template-columns:36px 64px 1fr 96px 110px 90px;
  gap:12px;align-items:center;padding:10px 16px;
  border-bottom:1px solid rgba(255,255,255,.04);transition:background .12s}
.trend-row:hover{background:rgba(255,255,255,.035)}
.trend-header-row{display:grid;grid-template-columns:36px 64px 1fr 96px 110px 90px;
  gap:12px;align-items:center;padding:8px 16px 10px;
  border-bottom:2px solid var(--brd);margin-bottom:0}
.trend-header-row span{font-size:10px;font-family:var(--font-head);font-weight:800;
  letter-spacing:.08em;text-transform:uppercase;color:#a0aac8;cursor:pointer}
.trend-header-row span:hover{color:var(--text)}
.trend-header-row span.active{color:var(--acc)}
.trend-rank{font-family:var(--font-mono);font-size:13px;color:#666;text-align:right;font-weight:700}
.trend-img-wrap{width:64px;height:90px;border-radius:6px;overflow:hidden;
  background:var(--surf);flex-shrink:0;border:1px solid var(--brd)}
.trend-img-wrap img{width:100%;height:100%;object-fit:cover;object-position:top center;display:none}
.trend-img-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-size:7px;color:var(--dim);text-align:center}
.trend-name{font-size:16px;font-weight:800;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trend-code{font-family:var(--font-mono);font-size:11px;color:#e87070;margin-top:3px;font-weight:600}
.trend-wr{font-family:var(--font-mono);font-size:18px;font-weight:800;text-align:right}
.trend-delta{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.trend-pill{font-family:var(--font-mono);font-size:14px;font-weight:800;
  padding:4px 12px;border-radius:20px;white-space:nowrap;display:inline-block}
.trend-pill.up{background:rgba(0,232,122,.15);color:var(--g1);border:1px solid rgba(0,232,122,.3)}
.trend-pill.down{background:rgba(239,68,68,.15);color:var(--r);border:1px solid rgba(239,68,68,.3)}
.trend-pill.flat{background:rgba(255,255,255,.05);color:#666;border:1px solid #333}
.trend-play-delta{font-family:var(--font-mono);font-size:10px;color:#888}
.trend-score{font-family:var(--font-mono);font-size:13px;font-weight:700;text-align:right}

/* Mini highlight card */
.trend-mini{display:flex;align-items:center;gap:10px;padding:6px 0;
  border-bottom:1px solid rgba(255,255,255,.04)}
.trend-mini:last-child{border-bottom:none}
.trend-mini-img{width:36px;height:50px;border-radius:4px;overflow:hidden;
  background:var(--surf);flex-shrink:0}
.trend-mini-img img{width:100%;height:100%;object-fit:cover;object-position:top center;display:none}
.trend-mini-img-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:6px;color:var(--dim)}
.trend-mini-name{font-size:13px;font-weight:700;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trend-mini-code{font-family:var(--font-mono);font-size:10px;color:#e87070;margin-top:2px}
.trend-mini-delta{font-family:var(--font-mono);font-size:13px;font-weight:800}

.trends-loading{text-align:center;padding:60px;color:#666;font-size:14px}
.trends-no-data{text-align:center;padding:40px;color:#555;font-size:14px;line-height:1.8}


/* ═══════════════════════════════════════════════════════
   EXPERIMENTAL — Best/Worst Matchups
   ═══════════════════════════════════════════════════════ */
.exp-hero{padding:8px 0 16px}
.exp-hero-title{font-family:var(--font-head);font-size:32px;font-weight:800;
  letter-spacing:.04em;text-transform:uppercase;color:var(--text)}
.exp-hero-sub{font-size:13px;color:#8a93b0;margin-top:4px;font-weight:500}
.exp-tag{display:inline-block;font-size:9px;font-family:var(--font-mono);
  color:#f5c518;border:1px solid rgba(245,197,24,.4);background:rgba(245,197,24,.08);
  padding:2px 8px;border-radius:20px;letter-spacing:.08em;text-transform:uppercase;
  margin-left:10px;vertical-align:middle}

.exp-controls{display:flex;gap:12px;margin:16px 0 20px;flex-wrap:wrap;align-items:flex-end}
.exp-controls>div{flex:1;min-width:220px}

.exp-summary{display:flex;gap:16px;align-items:center;margin-bottom:16px;
  padding:12px 16px;border:1px solid rgba(255,255,255,.06);border-radius:4px;
  background:linear-gradient(135deg,rgba(255,255,255,.02),rgba(255,255,255,0))}
.exp-summary-img{width:52px;height:73px;border-radius:5px;overflow:hidden;
  background:var(--surf);flex-shrink:0;border:1px solid rgba(255,255,255,.08)}
.exp-summary-img img{width:100%;height:100%;object-fit:cover;object-position:top center;display:none}
.exp-summary-img-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-size:7px;color:var(--dim)}
.exp-summary-name{font-size:17px;font-weight:800;font-family:var(--font-head);color:var(--text)}
.exp-summary-code{font-family:var(--font-mono);font-size:11px;color:#e87070;margin-top:2px}
.exp-summary-meta{font-size:12px;color:#8a93b0;font-family:var(--font-mono);margin-top:4px}

.exp-columns{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.exp-columns{grid-template-columns:1fr}}
.exp-panel{border:1px solid rgba(255,255,255,.06);border-radius:4px;
  background:linear-gradient(135deg,rgba(255,255,255,.02),rgba(255,255,255,0))}
.exp-panel-hdr{border-radius:4px 4px 0 0}
.exp-panel-hdr{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.06);
  display:flex;align-items:center;gap:8px}
.exp-panel-title{font-family:var(--font-head);font-size:13px;font-weight:800;
  letter-spacing:.08em;text-transform:uppercase}

.exp-row{display:grid;grid-template-columns:28px 40px 1fr 64px 64px;gap:14px;
  align-items:center;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.05);
  transition:background .1s}
.exp-row:last-child{border-bottom:none}
.exp-row:hover{background:rgba(255,255,255,.02)}
.exp-row-rank{font-family:var(--font-mono);font-size:11px;color:#555;text-align:right;font-weight:700}
.exp-row-img{width:40px;height:56px;border-radius:4px;overflow:hidden;
  background:var(--surf);flex-shrink:0}
.exp-row-img img{width:100%;height:100%;object-fit:cover;object-position:top center;display:none}
.exp-row-img-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-size:6px;color:var(--dim)}
.exp-row-name{font-size:13px;font-weight:700;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exp-row-code{font-family:var(--font-mono);font-size:9px;color:#e87070;margin-top:1px}
.exp-row-wr{font-family:var(--font-mono);font-size:15px;font-weight:800;text-align:right}
.exp-row-games{font-family:var(--font-mono);font-size:10px;color:#666;text-align:right}

.exp-empty{text-align:center;padding:40px 20px;color:#555;font-size:13px;line-height:1.8}

.exp-row{cursor:pointer}
.exp-row-expanded{grid-column:1/-1;padding:14px 16px 16px;
  border-top:1px solid rgba(255,255,255,.05);
  background:rgba(255,255,255,.015);overflow:visible}
.exp-detail-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.exp-detail-stat{padding:8px 12px;border-left:2px solid rgba(255,255,255,.1);border-radius:0}
.exp-detail-stat-lbl{font-size:9px;color:#666;font-family:var(--font-body);
  font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.exp-detail-stat-val{font-family:var(--font-mono);font-size:16px;font-weight:800}
.exp-detail-kc-title{font-size:10px;font-family:var(--font-head);font-weight:800;
  letter-spacing:.08em;text-transform:uppercase;color:#a0aac8;margin-bottom:8px}
.exp-detail-kc-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-start;overflow:visible;padding:10px 0}
.exp-detail-loading{font-size:11px;color:#555;font-style:italic}

.exp-min-games-note{font-size:11px;color:#666;font-family:var(--font-mono);margin-top:12px;text-align:right}

/* ═══════════════════════════════════════════════════════
   DECKBUSTER
   ═══════════════════════════════════════════════════════ */
.db-hero{text-align:center;padding:24px 0 16px}
.db-hero-title{font-family:var(--font-head);font-size:32px;font-weight:800;
  color:var(--text);letter-spacing:.04em}
.db-hero-sub{font-size:14px;color:#9aa8cc;margin-top:6px;font-weight:600}

.db-selector{display:flex;gap:8px;margin:16px 0;align-items:center;flex-wrap:wrap}
.db-selector select{flex:1;min-width:200px;padding:10px 14px;font-size:14px;
  font-family:var(--font-body);font-weight:600;
  border:1px solid #3a4060;border-radius:8px;background:var(--card);color:var(--text)}
.db-add-btn{padding:10px 20px;font-size:14px;font-weight:700;font-family:var(--font-head);
  background:rgba(244,0,161,.15);border:1px solid rgba(244,0,161,.4);border-radius:8px;
  color:var(--acc);cursor:pointer;transition:all .15s;letter-spacing:.04em;white-space:nowrap}
.db-add-btn:hover{background:rgba(244,0,161,.25)}

.db-selected{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0;min-height:60px;
  background:rgba(255,255,255,.02);border:1px dashed #2a3050;border-radius:10px;
  padding:12px;align-items:center}
.db-empty-hint{color:#555;font-size:13px;font-style:italic;margin:auto}
.db-opp-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;
  cursor:pointer}
.db-opp-img{width:56px;height:78px;border-radius:6px;overflow:hidden;
  border:2px solid rgba(244,0,161,.4);transition:all .15s}
.db-opp-img img{width:100%;height:100%;object-fit:cover;object-position:top center;display:none}
.db-opp-img-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-size:8px;color:var(--dim);text-align:center;padding:2px}
.db-opp-remove{position:absolute;top:-6px;right:-6px;width:18px;height:18px;
  border-radius:50%;background:var(--r);color:#fff;border:none;cursor:pointer;
  font-size:11px;font-weight:900;line-height:18px;text-align:center;display:none;z-index:5}
.db-opp-card:hover .db-opp-remove{display:block}
.db-opp-card:hover .db-opp-img{border-color:var(--r)}
.db-opp-name{font-size:9px;color:#8a93b0;font-family:var(--font-mono);max-width:56px;
  text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.db-bust-row{display:flex;gap:10px;margin:16px 0;align-items:center;flex-wrap:wrap}
.db-bust-btn{flex:1;padding:16px 24px;font-size:18px;font-weight:800;
  font-family:var(--font-head);letter-spacing:.04em;
  background:var(--acc);
  border:none;border-radius:10px;color:#fff;
  cursor:pointer;transition:background .15s,transform .15s}
.db-bust-btn:hover{background:#D9008F;transform:translateY(-1px)}
.db-bust-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.db-clear-btn{padding:10px 16px;font-size:13px;font-weight:600;
  background:transparent;border:1px solid #3a4060;border-radius:8px;
  color:#8a93b0;cursor:pointer;transition:all .15s}
.db-clear-btn:hover{border-color:#666;color:#ccc}

.db-results{margin-top:20px}
@keyframes db-card-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.db-result-card{background:var(--card);border:1px solid var(--brd);border-radius:12px;
  padding:16px 20px;margin-bottom:12px;
  border-left:4px solid;transition:all .2s;
  background:linear-gradient(135deg,rgba(255,255,255,.025),rgba(255,255,255,0));
  opacity:0;animation:db-card-in .5s cubic-bezier(.16,1,.3,1) forwards}
@media(prefers-reduced-motion:reduce){.db-result-card{animation:none;opacity:1}}
.db-result-card:hover{box-shadow:0 8px 32px rgba(0,0,0,.4);transform:translateY(-1px)}
.db-result-header{display:flex;gap:16px;align-items:flex-start;margin-bottom:14px}
.db-result-img-wrap{width:70px;height:98px;border-radius:8px;overflow:hidden;
  flex-shrink:0;border:2px solid var(--brd)}
.db-result-img-wrap img{width:100%;height:100%;object-fit:cover;object-position:top center;display:none}
.db-result-img-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-size:8px;color:var(--dim);text-align:center;padding:4px}
.db-result-meta{flex:1}
.db-result-rank{font-family:var(--font-mono);font-size:11px;color:var(--dim);margin-bottom:4px;font-weight:600}
.db-result-name{font-size:20px;font-weight:800;font-family:var(--font-body);color:var(--text);margin-bottom:2px}
.db-result-code{font-family:var(--font-mono);font-size:11px;color:#e87070;margin-bottom:10px}
.db-result-score{font-family:var(--font-mono);font-size:28px;font-weight:700}
.db-result-score-lbl{font-size:11px;color:#8a93b0;margin-top:2px;font-weight:600}
.db-mu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:12px}
.db-mu-row{background:rgba(255,255,255,.03);border-radius:7px;padding:8px 10px;
  display:flex;align-items:center;gap:8px}
.db-mu-img{width:28px;height:39px;border-radius:3px;overflow:hidden;flex-shrink:0;background:var(--surf)}
.db-mu-img img{width:100%;height:100%;object-fit:cover;object-position:top center;display:none}
.db-mu-img-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:6px;color:var(--dim)}
.db-mu-info{flex:1;min-width:0}
.db-mu-name{font-size:9px;color:#9aa8cc;font-family:var(--font-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.db-mu-wr{font-family:var(--font-mono);font-size:14px;font-weight:700}
.db-mu-games{font-size:9px;color:#666;font-family:var(--font-mono)}
.db-coverage{font-size:12px;color:#8a93b0;margin-top:8px;font-family:var(--font-mono);font-weight:600}
.db-no-data{text-align:center;padding:40px;color:#555;font-size:14px}

/* ═══════════════════════════════════════════════════════════════
   VISUAL THEME — CDA clean + Wispr ambient
   ═══════════════════════════════════════════════════════════════ */

/* Animated ambient orbs (Wispr-inspired) */
@keyframes orb-drift {
  0%,100%{transform:translate(0,0) scale(1)}
  25%{transform:translate(40px,-30px) scale(1.08)}
  50%{transform:translate(-20px,40px) scale(0.94)}
  75%{transform:translate(30px,20px) scale(1.04)}
}
@keyframes orb-drift-r {
  0%,100%{transform:translate(0,0) scale(1)}
  25%{transform:translate(-30px,40px) scale(0.96)}
  50%{transform:translate(40px,-20px) scale(1.06)}
  75%{transform:translate(-40px,-30px) scale(0.98)}
}

/* Header — clean editorial */
.hdr{background:transparent;border-bottom:1px solid rgba(255,255,255,.08);box-shadow:none}

/* Glowing title */
.hdr-title{font-family:var(--font-head);font-size:18px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--text);line-height:1;text-shadow:none;animation:none}

/* Stat cards — CDA panel style */
.stat-card{background:transparent;border:none;border-left:2px solid rgba(255,255,255,.12);border-radius:0;padding:8px 18px;transition:border-color .2s}
.stat-card:hover{border-left-color:var(--acc)}

/* Tabs — cleaner active state */
.tab-btn{transition:color .15s,border-color .15s;border-bottom:2px solid transparent;border-radius:0;background:transparent!important;font-size:11px;font-weight:700;padding:10px 20px;letter-spacing:.1em;text-transform:uppercase;color:#666;box-shadow:none!important}
.tab-btn.active{border-bottom-color:var(--acc);color:var(--text);}

/* Rank rows — CDA-style clean hover */
.rank-row{transition:background .15s,border-left-color .15s}
.rank-row:hover{background:rgba(255,255,255,.02)}

/* WR numbers — tier glow */
/* WR tier glow removed for a flatter, calmer number treatment */

/* Matchup context banner */
.ctx-banner{border-radius:10px;border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.02);
  text-align:center;justify-content:center;flex-direction:column;align-items:center;gap:4px}

/* Advice box */
.adv-box{border-radius:12px;
  background:rgba(255,255,255,.025);
  border:1px solid rgba(255,255,255,.06)}

/* Deck tiles */
.deck-tile{transition:transform .2s,box-shadow .2s}
.deck-tile:hover{transform:translateY(-3px);
  box-shadow:0 8px 32px rgba(0,0,0,.5)}

/* Cards general — subtle depth */
.oh-card,.dl-card{
  background:linear-gradient(135deg,rgba(255,255,255,.025) 0%,rgba(255,255,255,0) 100%);
  border-color:rgba(255,255,255,.08);
  box-shadow:0 4px 24px rgba(0,0,0,.25)}

/* Dataset picker — styled */
.dataset-row select{
  background:linear-gradient(135deg,rgba(255,255,255,.04),rgba(255,255,255,.01));
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 2px 12px rgba(0,0,0,.3);
  transition:border-color .2s,box-shadow .2s}
.dataset-row select:focus{
  border-color:rgba(244,0,161,.5);
  box-shadow:0 0 0 3px rgba(244,0,161,.12);
  outline:none}

/* Make app content sit above orbs */
#app{position:relative;z-index:1}

/* Stats strip */
.stats-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-bottom:1.5rem;border-bottom:1px solid rgba(255,255,255,.06);padding-bottom:1.25rem}
.stat-card{background:var(--card);border:1px solid var(--brd);border-radius:10px;padding:12px 14px;transition:border .15s}
.stat-card:hover{border-color:rgba(244,0,161,.4)}
.stat-label{font-size:10px;font-family:var(--font-body);font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#444;margin-bottom:4px}
.stat-val{font-size:18px;font-weight:700;font-family:var(--font-head);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Tabs */
.tabs{display:flex;gap:0;margin-bottom:1.5rem;flex-wrap:wrap;border-bottom:1px solid rgba(255,255,255,.08)}
.tab-btn{padding:6px 16px;border-radius:24px;font-size:12px;font-weight:600;border:1px solid var(--brd);background:transparent;color:var(--dim);letter-spacing:.03em;transition:all .15s}
.tab-btn:hover{color:var(--text);border-color:#444444}
.tab-btn.active{border-color:var(--acc);background:var(--acc-dim);color:var(--acc)}

/* Filter bar */
.filter-bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.filter-bar .label{font-size:10px;font-family:var(--font-head);font-weight:700;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.filter-btn{padding:4px 12px;border-radius:16px;font-size:11px;font-weight:500;border:1px solid var(--brd);background:transparent;color:var(--dim);transition:all .15s}
.filter-btn:hover{color:var(--text)}
.filter-btn.active{border-color:var(--acc);background:var(--acc-dim);color:var(--acc)}
.filter-count{font-size:10px;color:var(--dim);margin-left:4px}
.clear-btn{font-size:10px;color:var(--dim);background:transparent;border:1px solid var(--brd);border-radius:10px;padding:2px 8px;transition:all .15s}
.clear-btn:hover{color:var(--text);border-color:#444444}

/* Rank table */
.rank-header{display:grid;grid-template-columns:32px 48px 26px 1fr 66px 52px;gap:8px;align-items:center;padding:0 10px 8px;border-bottom:2px solid var(--brd);margin-bottom:0}
.rank-header span{font-size:10px;font-family:var(--font-head);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);cursor:pointer;user-select:none}
.rank-header span.sort-active{color:var(--acc)}
.rank-header span:hover{color:var(--text)}
.rank-row{display:grid;grid-template-columns:32px 48px 26px 1fr 66px 52px;gap:12px;align-items:center;padding:12px 14px;border-radius:0;cursor:pointer;transition:background .1s;border-left:3px solid transparent;border-bottom:1px solid rgba(255,255,255,.05)}
.rank-row:hover{background:rgba(255,255,255,.04)}
.rank-row.off{opacity:.3}
.rank-num{font-family:var(--font-mono);font-size:12px;color:#9aa8cc;text-align:right;font-weight:700}
.rank-name{font-size:15px;font-weight:700;color:var(--text);font-family:var(--font-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-code{font-family:var(--font-mono);font-size:11px;color:#e87070;margin-top:1px;font-weight:600}
.rank-wr{font-family:var(--font-mono);font-size:14px;font-weight:700;text-align:right}
.rank-play{font-family:var(--font-mono);font-size:12px;color:#c0cae0;text-align:right;font-weight:600}
/* Inline card image */
.rank-img-wrap{width:48px;height:67px;border-radius:5px;overflow:hidden;background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .12s}
.rank-img-wrap img{width:100%;height:100%;object-fit:cover;object-position:top center;display:none}
.rank-img-ph{font-family:var(--font-mono);font-size:8px;color:var(--dim);text-align:center;padding:2px;line-height:1.3}
.rank-row.off .rank-img-wrap{opacity:.35}
/* Sort bar */
.sort-bar{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.sort-lbl{font-size:12px;color:#c0c8e0;font-weight:700;font-family:var(--font-head);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.sort-btn{background:transparent;border:1px solid #3a4060;border-radius:20px;padding:4px 13px;font-size:12px;color:#b0bbd8;cursor:pointer;font-family:var(--font-body);transition:all .12s;font-weight:600}
.sort-btn.active{background:var(--acc-dim);border-color:var(--acc);color:var(--acc)}
.sort-btn:hover{color:var(--text);border-color:#555}

/* Toggle */
.tog{width:28px;height:15px;border-radius:8px;border:1px solid #3a3a3a;background:var(--surf);position:relative;flex-shrink:0;transition:all .2s}
.tog.on{background:var(--acc);border-color:var(--acc)}
.tog::after{content:'';position:absolute;top:2.5px;left:2.5px;width:8px;height:8px;border-radius:50%;background:#555555;transition:all .2s}
.tog.on::after{left:15px;background:var(--bg)}

/* Win rate bar */
.wr-bar-wrap{position:relative;flex:1;height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
.wr-bar-fill{height:100%;border-radius:3px;transition:width .3s}
.wr-bar-mid{position:absolute;left:50%;top:0;width:1px;height:100%;background:rgba(255,255,255,.12)}

/* Recalc banner */
.recalc-banner{background:rgba(244,0,161,.08);border:1px solid rgba(244,0,161,.3);border-radius:8px;padding:8px 12px;font-size:11px;color:#FF6FC4;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.no-recalc-banner{background:var(--card);border:1px solid var(--brd);border-radius:8px;padding:8px 12px;font-size:11px;color:#888888;margin-bottom:10px}

/* Advisor */
.adv-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:6px}
.drop-label{font-size:10px;font-family:var(--font-head);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.cb-row{display:flex;align-items:center;gap:7px;margin-top:6px;font-size:11px;color:var(--dim);cursor:pointer;user-select:none}
.cb-row:hover{color:var(--text)}
.advice-card{border-radius:12px;padding:24px 20px;text-align:center;margin:14px 0;border:1px solid var(--brd);background:var(--card);position:relative;overflow:hidden}
.advice-card.has-gauge{display:flex;align-items:center;justify-content:space-between;gap:24px;text-align:left;flex-wrap:wrap}
.advice-info{flex:1;min-width:200px}
.advice-gauge{position:relative;width:88px;height:88px;flex-shrink:0}
.advice-gauge svg{width:100%;height:100%;display:block}
.advice-gauge-track{stroke:rgba(255,255,255,.08)}
.advice-gauge-fill{stroke-linecap:round;stroke-dasharray:263.9;stroke-dashoffset:263.9;
  transition:stroke-dashoffset 1s cubic-bezier(.16,1,.3,1)}
.advice-gauge-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-weight:700;font-size:16px}
.advice-card::before{content:'';position:absolute;inset:0;opacity:.04;background:var(--accent-col,var(--acc));pointer-events:none}
.advice-pill{font-size:10px;font-family:var(--font-head);font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#888888;margin-bottom:10px}
.advice-text{font-family:var(--font-head);font-size:24px;font-weight:800;letter-spacing:.03em;margin-bottom:8px}
.advice-sub{font-size:12px;color:#aaaaaa;margin-bottom:5px}
.advice-src{font-size:10px;font-family:var(--font-mono);color:#8a93b0}
.mu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.mu-tile{background:var(--surf);border:1px solid var(--brd);border-radius:4px;padding:12px;text-align:center;transition:border .15s}
.mu-label{font-size:11px;font-family:var(--font-head);font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#b8c4e0;margin-bottom:5px}
.mu-val{font-family:var(--font-mono);font-size:20px;font-weight:700;margin-bottom:3px}
.mu-note{font-size:9px;color:#8a93b0;font-family:var(--font-mono)}
.deck-pair{display:grid;grid-template-columns:1fr 84px 1fr;gap:8px;align-items:start}
.deck-tile{background:var(--surf);border:1px solid var(--brd);border-radius:10px;padding:14px;text-align:center;transition:border .15s}
.deck-img-wrap{width:90px;height:126px;margin:0 auto 10px;border-radius:8px;overflow:hidden;background:var(--card);display:flex;align-items:center;justify-content:center}
.deck-img-wrap img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.deck-img-ph{font-family:var(--font-mono);font-size:10px;color:var(--dim);padding:8px;text-align:center;line-height:1.4}
.deck-tile-code{font-family:var(--font-mono);font-size:10px;color:var(--acc);margin-bottom:3px}
.deck-tile-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck-tile-wr{font-family:var(--font-mono);font-size:12px;margin-bottom:2px}
.deck-tile-play{font-size:10px;color:#9aa3c0;font-family:var(--font-mono)}
.vs-label{text-align:center;display:flex;align-items:center;justify-content:center;padding:4px;position:relative;z-index:10}.vs-label img{width:90px;height:auto;}


/* ═══════════════════════════════════════════════════════
   BATTLE ANIMATIONS
   ═══════════════════════════════════════════════════════ */

.deck-pair{position:relative;overflow:visible}

/* FAVOURABLE — My card attacks */
@keyframes my-attack{
  0%  {transform:translateX(0) scale(1) rotate(0deg);filter:brightness(1)}
  15% {transform:translateX(-12px) scale(0.93) rotate(-4deg);filter:brightness(0.85)} /* wind-up */
  45% {transform:translateX(min(260px,32vw)) scale(1.18) rotate(10deg);
       filter:brightness(1.6) drop-shadow(0 0 24px rgba(244,0,161,.9))} /* strike */
  58% {transform:translateX(min(250px,31vw)) scale(1.05) rotate(6deg);filter:brightness(1.3)}
  100%{transform:translateX(0) scale(1) rotate(0deg);filter:brightness(1)}
}
@keyframes opp-recoil{
  0%,40%{transform:translateX(0) scale(1) rotate(0deg);filter:brightness(1)}
  50%    {transform:translateX(min(40px,5vw)) scale(0.88) rotate(12deg);
          filter:brightness(2) saturate(2) drop-shadow(0 0 16px rgba(255,60,60,.8))}
  65%    {transform:translateX(min(12px,2vw)) scale(0.94) rotate(4deg)}
  100%   {transform:translateX(0) scale(1) rotate(0deg);filter:brightness(1)}
}

/* DISADVANTAGED — Opponent attacks */
@keyframes opp-attack{
  0%  {transform:translateX(0) scale(1) rotate(0deg);filter:brightness(1)}
  15% {transform:translateX(12px) scale(0.93) rotate(4deg);filter:brightness(0.85)}
  45% {transform:translateX(min(-260px,-32vw)) scale(1.18) rotate(-10deg);
       filter:brightness(1.6) drop-shadow(0 0 24px rgba(244,0,161,.9))}
  58% {transform:translateX(min(-250px,-31vw)) scale(1.05) rotate(-6deg)}
  100%{transform:translateX(0) scale(1) rotate(0deg);filter:brightness(1)}
}
@keyframes my-recoil{
  0%,40%{transform:translateX(0) scale(1) rotate(0deg);filter:brightness(1)}
  50%   {transform:translateX(min(-40px,-5vw)) scale(0.88) rotate(-12deg);
         filter:brightness(2) saturate(2) drop-shadow(0 0 16px rgba(255,60,60,.8))}
  65%   {transform:translateX(min(-12px,-2vw)) scale(0.94) rotate(-4deg)}
  100%  {transform:translateX(0) scale(1) rotate(0deg);filter:brightness(1)}
}

/* EVEN — Both clash in the middle */
@keyframes my-clash{
  0%  {transform:translateX(0) scale(1);filter:brightness(1)}
  12% {transform:translateX(-10px) scale(0.95);filter:brightness(0.9)}
  42% {transform:translateX(min(190px,24vw)) scale(1.12);
       filter:brightness(1.5) drop-shadow(0 0 18px rgba(245,208,0,.8))}
  56% {transform:translateX(min(185px,23vw)) scale(1.06)}
  100%{transform:translateX(0) scale(1);filter:brightness(1)}
}
@keyframes opp-clash{
  0%  {transform:translateX(0) scale(1);filter:brightness(1)}
  12% {transform:translateX(10px) scale(0.95);filter:brightness(0.9)}
  42% {transform:translateX(min(-190px,-24vw)) scale(1.12);
       filter:brightness(1.5) drop-shadow(0 0 18px rgba(245,208,0,.8))}
  56% {transform:translateX(min(-185px,-23vw)) scale(1.06)}
  100%{transform:translateX(0) scale(1);filter:brightness(1)}
}

/* Shockwave on deck-pair at impact */
@keyframes shockwave{
  0%,38%{transform:none}
  42%   {transform:translate(-4px,2px)}
  46%   {transform:translate(4px,-2px)}
  50%   {transform:translate(-2px,3px)}
  54%   {transform:translate(3px,-1px)}
  58%   {transform:none}
}

/* Even matchup — same ring language as favourable/disadvantaged, in amber,
   with a second ring a beat behind it (two forces meeting, neither winning
   cleanly) instead of a sword emoji. */
@keyframes swords-flash{
  0%,30%{opacity:0;transform:translate(-50%,-50%) scale(0.15)}
  45%   {opacity:1;transform:translate(-50%,-50%) scale(1.3)}
  100%  {opacity:0;transform:translate(-50%,-50%) scale(2.6)}
}
@keyframes swords-flash-2{
  0%,42%{opacity:0;transform:translate(-50%,-50%) scale(0.15)}
  55%   {opacity:.75;transform:translate(-50%,-50%) scale(1.15)}
  100%  {opacity:0;transform:translate(-50%,-50%) scale(2.3)}
}
.clash-swords{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%) scale(0);
  width:76px;height:76px;border-radius:50%;pointer-events:none;opacity:0;z-index:25;
  border:3px solid var(--y);box-shadow:0 0 24px rgba(245,208,0,.55),inset 0 0 20px rgba(245,208,0,.25);}
.clash-swords-2{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%) scale(0);
  width:76px;height:76px;border-radius:50%;pointer-events:none;opacity:0;z-index:24;
  border:3px solid var(--y);}


/* ─── Updated battle selectors (specific classes, not :first/:last-child) ─── */
.deck-pair[data-anim='favourable']                    {animation:shockwave 1.3s ease-out forwards}
.deck-pair[data-anim='favourable'] .deck-tile-my      {animation:my-attack  1.3s cubic-bezier(.4,0,.2,1) forwards}
.deck-pair[data-anim='favourable'] .deck-tile-opp     {animation:opp-recoil 1.3s cubic-bezier(.4,0,.2,1) forwards}
.deck-pair[data-anim='favourable'] .impact-fx         {animation:impact-burst 1.3s ease-out forwards;right:18%;left:auto}

.deck-pair[data-anim='disadvantaged']                  {animation:shockwave 1.3s ease-out forwards}
.deck-pair[data-anim='disadvantaged'] .deck-tile-my    {animation:my-recoil  1.3s cubic-bezier(.4,0,.2,1) forwards}
.deck-pair[data-anim='disadvantaged'] .deck-tile-opp   {animation:opp-attack 1.3s cubic-bezier(.4,0,.2,1) forwards}
.deck-pair[data-anim='disadvantaged'] .impact-fx       {animation:impact-burst 1.3s ease-out forwards;left:18%;right:auto}

.deck-pair[data-anim='even']                           {animation:shockwave 1.6s ease-out forwards}
.deck-pair[data-anim='even'] .deck-tile-my             {animation:my-clash   1.6s cubic-bezier(.4,0,.2,1) forwards}
.deck-pair[data-anim='even'] .deck-tile-opp            {animation:opp-clash  1.6s cubic-bezier(.4,0,.2,1) forwards}
.deck-pair[data-anim='even'] .clash-swords             {animation:swords-flash 1.6s ease-out forwards}
.deck-pair[data-anim='even'] .clash-swords-2           {animation:swords-flash-2 1.6s ease-out forwards}


/* ─── Card hover zoom ─────────────────────────────────── */
.oh-item{transition:z-index 0s .25s}
.oh-item:hover{z-index:50;transition:z-index 0s}
.oh-item .oh-img-wrap{transition:transform .25s cubic-bezier(.34,1.56,.64,1),
                      box-shadow .25s ease;transform-origin:bottom center}
.oh-item:hover .oh-img-wrap{
  transform:scale(2.9);
  box-shadow:0 12px 40px rgba(0,0,0,.85),0 0 20px rgba(244,0,161,.25)}

.dl-card-item{position:relative;transition:z-index 0s .25s}
.dl-card-item:hover{z-index:50;transition:z-index 0s}
.dl-card-item .dl-img-wrap{transition:transform .25s cubic-bezier(.34,1.56,.64,1),
                            box-shadow .25s ease;transform-origin:bottom center}
.dl-card-item:hover .dl-img-wrap{
  transform:scale(3.3);
  box-shadow:0 12px 40px rgba(0,0,0,.85),0 0 16px rgba(244,0,161,.2)}

/* Rank image */
.rank-img-wrap{position:relative;z-index:1}


/* Searchable combobox dropdown */
.combo-wrap{position:relative;width:100%}
.combo-input{width:100%;padding:10px 14px;font-size:14px;font-family:var(--font-body);
  font-weight:500;border:1px solid #3a4060;border-radius:8px;
  background:var(--surf);color:var(--text);outline:none;
  transition:border-color .15s;cursor:text}
.combo-input:focus{border-color:rgba(244,0,161,.5)}
.combo-input.has-value{border-color:rgba(244,0,161,.35)}
.combo-list{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:200;
  background:var(--card);border:1px solid #3a4060;border-radius:10px;
  max-height:260px;overflow-y:auto;
  box-shadow:0 8px 32px rgba(0,0,0,.6),0 0 0 1px rgba(244,0,161,.1);
  display:none}
.combo-list.open{display:block}
.combo-group-label{padding:6px 14px 3px;font-size:10px;font-family:var(--font-head);
  font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:#666;border-top:1px solid #2a2a2a}
.combo-group-label:first-child{border-top:none}
.combo-item{padding:9px 14px;cursor:pointer;font-size:13px;
  font-family:var(--font-body);color:#c8d0e8;
  transition:background .1s;display:flex;align-items:center;gap:8px;border-radius:0}
.combo-item:hover,.combo-item.focused{background:rgba(244,0,161,.12);color:var(--text)}
.combo-item.selected{color:var(--acc);font-weight:700}
.combo-item-code{font-family:var(--font-mono);font-size:10px;color:#e87070;flex-shrink:0}
.combo-item-play{font-family:var(--font-mono);font-size:10px;color:#555;margin-left:auto;flex-shrink:0}
.combo-fav-star{font-size:12px;color:#f5c518;flex-shrink:0}
.combo-no-results{padding:14px;text-align:center;color:#555;font-size:13px;font-style:italic}

/* Toggle button on rank row */
.rank-toggle-btn{width:22px;height:22px;border-radius:4px;border:1.5px solid;
  font-size:13px;line-height:1;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;transition:all .15s;
  background:transparent;padding:0}
.rank-toggle-btn.on{border-color:var(--g1);color:var(--g1);
  box-shadow:0 0 8px rgba(0,232,122,.3)}
.rank-toggle-btn.off{border-color:#444;color:#555}
.rank-toggle-btn:hover.on{background:rgba(0,232,122,.1)}
.rank-toggle-btn:hover.off{border-color:#777;color:#777}

.rank-img-wrap{position:relative}



/* Key cards hover zoom — stays anchored in place within its matchup box.
   The overflow:hidden that used to clip this has been removed from .exp-panel,
   so scaling in place no longer cuts cards off at the edges. */
.key-card-item{position:relative;transition:z-index 0s .2s;display:flex;flex-direction:column;align-items:center;gap:4px}
.key-card-item:hover{z-index:100;transition:z-index 0s}
.key-card-item .oh-img-wrap{transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease;
  transform-origin:center center}
.key-card-item:hover .oh-img-wrap{
  transform:scale(3);
  box-shadow:0 16px 48px rgba(0,0,0,.85),0 0 24px rgba(244,0,161,.3)}

/* Impact ring — expands and fades at the moment of contact, colored by
   actual outcome (green = landed in your favour, coral = against you)
   instead of an arbitrary yellow starburst that didn't distinguish them. */
@keyframes impact-burst{
  0%{opacity:0;transform:translate(-50%,-50%) scale(0.2)}
  30%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(2.5)}
}
.impact-fx{
  position:absolute;top:35%;
  width:80px;height:80px;border-radius:50%;
  pointer-events:none;opacity:0;z-index:18;
  border:3px solid var(--acc);
  box-shadow:0 0 24px rgba(244,0,161,.55),inset 0 0 20px rgba(244,0,161,.25);
}
.deck-pair[data-anim='favourable'] .impact-fx{
  border-color:var(--g1);
  box-shadow:0 0 24px rgba(0,232,122,.55),inset 0 0 20px rgba(0,232,122,.25);
}
.deck-pair[data-anim='disadvantaged'] .impact-fx{
  border-color:var(--r);
  box-shadow:0 0 24px rgba(239,68,68,.55),inset 0 0 20px rgba(239,68,68,.25);
}

/* Tooltip */
#tt{position:fixed;display:none;background:#161616;border:1px solid #333333;border-radius:12px;padding:12px;z-index:9999;width:200px;pointer-events:none;box-shadow:0 12px 40px rgba(0,0,0,.7)}
.tt-img-wrap{width:100%;aspect-ratio:716/1000;border-radius:6px;overflow:hidden;background:var(--card);margin-bottom:10px;display:flex;align-items:center;justify-content:center}
.tt-img{width:100%;height:100%;object-fit:cover}
.tt-ph{font-family:var(--font-mono);font-size:11px;color:var(--dim);text-align:center;padding:20px 8px}
.tt-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px}
.tt-code{font-family:var(--font-mono);font-size:10px;color:var(--acc);margin-bottom:8px}
.tt-row{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-bottom:3px}
.tt-row strong{font-weight:600}

/* Paste screen */
.paste-card{background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:20px;margin-bottom:14px}
.paste-title{font-family:var(--font-head);font-size:16px;font-weight:700;letter-spacing:.08em;color:var(--acc);margin-bottom:12px}
.paste-step{font-size:12px;color:#9aa3c0;line-height:2;margin-bottom:4px}
.paste-url{font-family:var(--font-mono);font-size:10px;color:#cccccc;word-break:break-all;display:block;margin:4px 0 10px;padding:6px 10px;background:var(--surf);border-radius:6px;border:1px solid var(--brd)}
.paste-ta{width:100%;height:120px;background:var(--surf);border:1px solid var(--brd);border-radius:8px;color:var(--text);font-family:var(--font-mono);font-size:11px;padding:10px;outline:none;display:block;margin-bottom:6px;transition:border .15s}
.paste-ta:focus{border-color:var(--acc)}
.paste-err{font-size:11px;color:var(--r);margin-bottom:6px}
.cache-note{font-size:10px;color:var(--dim);margin-top:8px}

/* Buttons */
.btn-primary{background:var(--acc);color:var(--bg);border:none;border-radius:8px;padding:9px 24px;font-size:13px;font-weight:700;letter-spacing:.04em;transition:opacity .15s}
.btn-primary:hover{opacity:.9}
.btn-ghost{background:transparent;border:1px solid var(--brd);color:var(--dim);border-radius:8px;padding:6px 14px;font-size:11px;transition:all .15s}
.btn-ghost:hover{color:var(--text);border-color:#2e4560}

/* Debug */
.debug-section{background:var(--card);border:1px solid var(--brd);border-radius:10px;padding:14px;margin-bottom:10px}
.debug-title{font-size:10px;font-family:var(--font-head);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);margin-bottom:8px}
.debug-row{display:grid;grid-template-columns:130px 1fr;gap:10px;margin-bottom:4px}
.debug-key{font-family:var(--font-mono);font-size:10px;color:var(--acc)}
.debug-val{font-family:var(--font-mono);font-size:10px;color:var(--text);word-break:break-all}
.debug-val.null{color:#ff5555}

/* Loading */
.loading{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:13px;padding:40px 0}
.spin{width:18px;height:18px;border:2px solid #333333;border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Misc */
.note{font-size:10px;color:var(--dim);margin-top:10px;line-height:1.7}
/* Decklist section */
.dl-card{margin-top:16px;background:var(--card);border:1px solid var(--brd);border-radius:4px;padding:14px 16px}
.dl-title{font-family:var(--font-head);font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--text);margin-bottom:4px}
.dl-subtitle{font-size:10px;color:#8a93b0;font-family:var(--font-mono);margin-bottom:12px}
.dl-entry{background:var(--surf);border:1px solid var(--brd);border-radius:8px;padding:10px 12px;margin-bottom:10px;overflow:visible}
.dl-entry-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px}
.dl-entry-wr{font-family:var(--font-mono);font-size:14px;font-weight:700}
.dl-entry-meta{font-family:var(--font-mono);font-size:10px;color:#b8c0d8}
.dl-cards{display:flex;flex-wrap:wrap;gap:4px;align-items:flex-end;overflow:visible}
.dl-card-item{display:flex;flex-direction:column;align-items:center;gap:2px}
.dl-img-wrap{border-radius:4px;overflow:hidden;background:var(--card);border:1px solid var(--brd);position:relative}
.dl-img-wrap img{display:none;object-fit:cover;object-position:top center}
.dl-img-ph{display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);color:var(--dim);text-align:center}
.dl-count{font-family:var(--font-mono);font-size:9px;font-weight:700;color:var(--acc)}
.dl-empty{font-size:12px;color:var(--dim);text-align:center;padding:16px 0}
/* Opening hand guide */
.oh-dual{display:grid;grid-template-columns:1fr 1fr;gap:16px;overflow:visible}
.oh-side-label{font-size:9px;font-family:var(--font-head);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.oh-side-label span{color:var(--acc);font-size:10px}
@media(max-width:600px){.oh-dual{grid-template-columns:1fr}}
.oh-card{margin-top:16px;overflow:visible;background:var(--card);border:1px solid var(--brd);border-radius:4px;padding:18px 20px}
.oh-title{font-family:var(--font-head);font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.oh-subtitle{font-size:10px;color:#8a93b0;font-family:var(--font-mono);margin-top:2px}
.oh-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:12px;overflow:visible}
.oh-item{display:flex;flex-direction:column;align-items:center;gap:6px}
.oh-img-wrap{width:60px;height:84px;border-radius:5px;overflow:hidden;background:var(--surf);border:1px solid var(--brd)}
.oh-img-wrap img{width:100%;height:100%;object-fit:cover;object-position:top center;display:none}
.oh-img-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:8px;color:var(--dim);text-align:center;padding:2px}
.oh-rate{font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--g1)}
.oh-code{font-family:var(--font-mono);font-size:8px;color:#8a93b0;text-align:center;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oh-empty{font-size:12px;color:var(--dim);text-align:center;padding:16px 0}
.oh-ds-note{font-size:10px;color:#6a7090;margin-top:6px;text-align:right;font-family:var(--font-mono)}
/* Favourites */
.fav-btn{background:none;border:none;cursor:pointer;font-size:16px;color:var(--dim);padding:0 4px;line-height:1;transition:color .15s;flex-shrink:0}
.fav-btn:hover{color:#f5c518}
.fav-btn.starred{color:#f5c518}
.fav-group-label{font-size:9px;color:var(--dim);font-family:var(--font-head);letter-spacing:.1em;text-transform:uppercase;padding:4px 8px 2px;border-bottom:1px solid var(--brd);margin-bottom:2px}
.deck-sel-wrap{display:flex;align-items:center;gap:6px;width:100%}
.deck-search-input:focus{border-color:rgba(244,0,161,.5)!important}
.low-badge{font-size:9px;background:rgba(255,140,34,.15);color:#ff8c22;border:1px solid rgba(255,140,34,.3);border-radius:4px;padding:1px 5px;font-family:var(--font-mono);flex-shrink:0;white-space:nowrap}
.ctx-banner{border-radius:8px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.ctx-label{font-family:var(--font-head);font-size:14px;font-weight:700;letter-spacing:.05em}
.ctx-wr{font-family:var(--font-mono);font-size:12px;opacity:.8}
.empty-state{background:var(--card);border:1px solid var(--brd);border-radius:10px;padding:24px;text-align:center;color:var(--dim);font-size:13px;line-height:1.8}
/* ═══════════════════════════════════════════════════════
   LANDING-PAGE ALIGNMENT PASS — header/hero area
   Bringing the app's most-viewed screen in line with the landing page's
   design language: ambient depth instead of flat black, a live-data pulse
   instead of a plain static badge, and the flagship-vs-supporting card
   distinction instead of three identically-treated stat boxes.
   Placed last on purpose so it wins the cascade cleanly over the earlier,
   superseded rules above rather than requiring a hunt-and-delete pass.
   ═══════════════════════════════════════════════════════ */

/* Ambient glow — same magenta/cyan pairing as the landing page's hero,
   but static rather than an animated WebGL shader. This renders behind
   every screen in a session that can run for a while, so a continuously
   animated GPU-driven background would cost more than it's worth here;
   a landing page is seen once, briefly — this tool is used repeatedly. */
body{
  background-image:
    radial-gradient(ellipse 60% 40% at 15% 0%, rgba(244,0,161,.07), transparent 60%),
    radial-gradient(ellipse 50% 35% at 100% 10%, rgba(0,229,255,.05), transparent 60%);
  background-repeat:no-repeat;
}

/* Live-data pulse on the "Updated" badge — same device as the landing
   page's demo card, reused here because it's telling the truth in both
   places: this really is live, auto-refreshing data. */
.hdr-badge{
  background:rgba(244,0,161,.06);border:1px solid rgba(244,0,161,.25);
  border-radius:20px;padding:5px 14px 5px 12px;font-size:12px;color:#c8d0e8;
  font-family:var(--font-mono);font-weight:600;
  display:inline-flex;align-items:center;gap:7px;
}
.hdr-badge::before{
  content:'';width:6px;height:6px;border-radius:50%;flex-shrink:0;
  background:var(--g1);animation:hdr-pulse 2s ease-in-out infinite;
}
@keyframes hdr-pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.hdr-badge::before{animation:none}}

/* Flagship stat card — "Best deck" gets real visual priority since it's
   the single most important number on the page; the other two stay quiet
   supporting stats, instead of all three getting the identical treatment. */
.stats-strip{align-items:stretch}
.stat-card:first-child{
  background:linear-gradient(135deg,rgba(244,0,161,.07),rgba(244,0,161,.01));
  border:1px solid rgba(244,0,161,.28);border-radius:10px;padding:14px 16px;
}
.stat-card:first-child .stat-label{color:rgba(244,0,161,.75)}
.stat-card:first-child .stat-val{font-size:20px}
</style>
</head>
<body>
<div id="tt">
  <div class="tt-img-wrap"><img class="tt-img" id="tt-img" alt=""><div class="tt-ph" id="tt-ph" style="display:none"></div></div>
  <div class="tt-name" id="tt-name"></div>
  <div class="tt-code" id="tt-code"></div>
  <div id="tt-body"></div>
</div>

<div class="wrap">
  <div id="app"></div>
</div>

<script>
// ── Constants ────────────────────────────────────────────────────
const CACHE_KEY='optcg_stats_v2';
const CACHE_TTL=12*60*60*1000; // 12h
const LS_DECK='optcg_default_deck';

// ── Colour helpers ───────────────────────────────────────────────
function wrCol(v){
  if(v==null||isNaN(v))return'var(--dim)';
  if(v>=56)return'var(--g1)';if(v>=50)return'var(--g2)';
  if(v>=47)return'var(--y)';if(v>=44)return'var(--o)';if(v>=38)return'var(--r)';return'var(--rr)';
}
function asPct(v){
  if(v==null)return null;const n=parseFloat(v);if(isNaN(n))return null;
  if(n>1&&n<=100)return parseFloat(n.toFixed(3));
  if(n===0)return 0;
  return parseFloat((n*100).toFixed(3));
}
function fmt(v,d=1){return(v!=null&&!isNaN(v))?v.toFixed(d)+'%':'—';}
function fld(o,...ks){for(const k of ks)if(o!=null&&o[k]!=null)return o[k];return null;}

// ── Card image (tries 3 sources) ─────────────────────────────────
function applyCardImg(imgEl,phEl,id){
  if(!id||id==='?'){imgEl.style.display='none';if(phEl){phEl.textContent=id||'?';phEl.style.display='block';}return;}
  // Start hidden — only reveal once a URL successfully loads (avoids flash)
  imgEl.style.display='none';
  if(phEl)phEl.style.display='none';
  const set=id.split('-')[0];
  const urls=[
    `./data/cards/${id}.png`,                                                          // cached leader portraits
    `https://en.onepiece-cardgame.com/images/cardlist/card/${id}.png`,                 // Bandai official — works from any origin
    `https://limitlesstcg.nyc3.digitaloceanspaces.com/one-piece/${set}/${id}_op_en.webp`, // Limitless TCG
    `https://cdn.cardkaizoku.com/cards_en/${set}/${id}.png`,                           // cardkaizoku CDN (may be restricted)
    `https://cdn.cardkaizoku.com/cards_en/${set}/${id}_sm.webp`,                       // cardkaizoku CDN thumbnail
  ];
  let idx=0;
  function next(){
    if(idx>=urls.length){
      // All failed — show card code placeholder
      if(phEl){phEl.textContent=id;phEl.style.display='block';}
      return;
    }
    const test=new Image();
    const url=urls[idx++];
    test.onload=()=>{imgEl.src=url;imgEl.style.display='block';};
    test.onerror=()=>next();
    test.src=url;
  }
  next();
}

// ── Matchup parser ───────────────────────────────────────────────
function parseMuEntry(m){
  // Try every plausible field name for the opponent's card code
  const opp=fld(m,'leader','opponentLeader','opponent_leader','opponent','opponentId',
                  'id','cardId','leaderCode','card_code','opponentCard','opposing_leader');
  if(!opp||typeof opp!=='string')return null;
  // Win rate: pre-calculated field first, then derive from wins/total
  let wr=asPct(fld(m,'matchup_win_rate','raw_win_rate','win_rate','rawWinRate','winRate','wr','overall_win_rate'));
  if(wr==null){
    const w=parseFloat(fld(m,'wins','win_count','w')||0);
    const t=parseFloat(fld(m,'number_of_matches','total_matches','total_games','total','games','count','n')||0);
    if(t>0)wr=parseFloat(((w/t)*100).toFixed(3));
  }
  return{
    opp,wr,
    f:asPct(fld(m,'first_win_rate','firstWinRate','firstWR','first')),
    s:asPct(fld(m,'second_win_rate','secondWinRate','secondWR','second')),
    n:parseFloat(fld(m,'number_of_matches','total_games','total_matches','total','games','count','n','game_count','numGames'))||null,
  };
}

// ── Main data parser ─────────────────────────────────────────────
function parseData(json){
  const topKeys=Array.isArray(json)?['[array of '+json.length+']']:Object.keys(json).slice(0,25);
  const arr=Array.isArray(json)?json:
    (json.leaders??json.decks??json.data??json.stats??json.results??json.leaderStats??null);
  if(!arr||!Array.isArray(arr)||!arr.length)
    return{decks:null,topKeys,sampleKeys:[],sampleVals:{},firstMuEntry:null};
  const first=arr[0];
  const sampleKeys=Object.keys(first);
  const sampleVals={};
  sampleKeys.slice(0,25).forEach(k=>{
    const v=first[k];
    sampleVals[k]=typeof v==='object'&&v?'[object/array len:'+(Array.isArray(v)?v.length:'?')+']':String(v??'').slice(0,80);
  });
  const rawMuArr=fld(first,'matchups','opponents','vs','matchupData');
  const firstMuEntry=Array.isArray(rawMuArr)&&rawMuArr.length?rawMuArr[0]:null;

  const decks=arr.map(d=>{
    const rawMu=fld(d,'matchups','opponents','vs','matchupData');
    const muArr=Array.isArray(rawMu)?rawMu:null;
    const mu={};
    if(muArr)muArr.forEach(m=>{const r=parseMuEntry(m);if(r?.opp)mu[r.opp]=r;});
    return{
      id:  fld(d,'leader','id','leaderId','cardId')||'?',
      name:fld(d,'leaderName','leader_name','name','displayName')||fld(d,'leader')||'?',
      wtdWR:asPct(fld(d,'weighted_win_rate','wtdWinRate','wtd_win_rate','wwr')),
      rawWR:asPct(fld(d,'raw_win_rate','rawWinRate','winRate','win_rate')),
      play: asPct(fld(d,'play_rate','playRate','play_rate_pct','popularity')),
      games:parseFloat(fld(d,'number_of_matches','total_games','games','count','n'))||null,
      f:   asPct(fld(d,'first_win_rate','firstWinRate','firstWR','first')),
      s:   asPct(fld(d,'second_win_rate','secondWinRate','secondWR','second')),
      mu:  Object.keys(mu).length?mu:null,
    };
  }).filter(d=>d.wtdWR!=null);
  return{decks:decks.length?decks:null,topKeys,sampleKeys,sampleVals,firstMuEntry};
}

// ── Recalculation ────────────────────────────────────────────────
function calcAdjWR(deck,activeIds,allDecks){
  if(!deck.mu)return null;
  let wSum=0,wN=0;
  activeIds.forEach(oppId=>{
    if(oppId===deck.id)return;
    const mu=deck.mu[oppId];
    const opp=allDecks.find(d=>d.id===oppId);if(opp&&opp.games!=null&&opp.games<100&&EXCL_LOW)return;
    const muWR=mu?.wr??(mu?.f!=null&&mu?.s!=null?(mu.f+mu.s)/2:null);if(muWR==null||!opp?.play)return;
    wSum+=muWR*opp.play;wN+=opp.play;
  });
  return wN>0?parseFloat((wSum/wN).toFixed(3)):null;
}
function canRecalc(){
  return DATA?.decks?.some(d=>d.mu&&Object.values(d.mu).some(m=>m.wr!=null))??false;
}

// ── Advisor ──────────────────────────────────────────────────────
function getAdvice(myDeck,oppDeck){
  let f=null,s=null,src='deck average';
  const mu=myDeck.mu?.[oppDeck.id];
  if(mu?.f!=null&&mu?.s!=null){f=mu.f;s=mu.s;src='matchup-specific';}
  else if(myDeck.f!=null&&myDeck.s!=null){f=myDeck.f;s=myDeck.s;}
  if(f==null||s==null)return{text:'Insufficient data',sub:'1st/2nd WR not available',col:'var(--dim)',src:'n/a',winPct:null};
  const diff=Math.abs(f-s);
  if(diff<=2)
    return{text:'Situational',sub:`Within 2% either way · ${fmt(f)} 1st · ${fmt(s)} 2nd · ${diff.toFixed(1)}% gap`,col:'var(--y)',src,winPct:Math.max(f,s)};
  if(f>s)return{text:'Take 1st',sub:`${fmt(f)} going first vs ${fmt(s)} going second`,col:'var(--info)',src,winPct:f};
  return{text:'Take 2nd',sub:`${fmt(s)} going second vs ${fmt(f)} going first`,col:'var(--info)',src,winPct:s};
}

function getMatchupCtx(wr){
  if(wr==null)return null;
  const s=fmt(wr)+' overall WR';
  if(wr>=75)return{label:'Hydrogen bomb vs Coughing Baby',sub:s,col:'var(--g1)'};
  if(wr>=60)return{label:'Heavily Favoured',sub:s,col:'var(--g1)'};
  if(wr>=55)return{label:'Favourable matchup',sub:s,col:'var(--g2)'};
  if(wr>=48)return{label:'Even matchup',sub:s,col:'var(--y)'};
  if(wr>=40)return{label:'Disadvantaged matchup',sub:s,col:'var(--o)'};
  if(wr>=30)return{label:'Time to lock in',sub:s,col:'var(--r)'};
  return{label:'GG, Go next...',sub:s,col:'var(--rr)'};
}


// ── Cache ────────────────────────────────────────────────────────
function saveCache(json){
  try{localStorage.setItem(CACHE_KEY,JSON.stringify({d:json,t:Date.now()}));}catch{}
}
function loadCache(){
  try{
    const c=localStorage.getItem(CACHE_KEY);if(!c)return null;
    const p=JSON.parse(c);
    if(Date.now()-p.t>CACHE_TTL)return null;
    return p.d;
  }catch{return null;}
}

// ── App state ────────────────────────────────────────────────────
// Dataset configuration — add new entries here when cardkaizoku adds new periods.
// Private-lobby variants were removed entirely (not representative of the
// real meta — too small and skewed a sample to surface as a real option).
// "(All Lobbies)" is dropped from the labels since it's now the only kind
// on offer — no longer a meaningful distinction to spell out every time.
const DATASETS=[
  {id:'west',     label:'Standard',              prefix:'stats_west_'   },
  {id:'lw',       label:'Standard Last Week',    prefix:'stats_lw_'     },
  {id:'op17_lw',  label:'OP17 Last Week',        prefix:'stats_op17_lw_' },
  {id:'exreg',    label:'Extra Reg Last Week',   prefix:'stats_exreg_'   },
  {id:'op16_lw',  label:'OP16 Final Week',       prefix:'stats_op16_lw_' },
];
const LS_DATASET='optcg_dataset';
const LS_FAVS='optcg_favs';
let FAVS=new Set(JSON.parse(localStorage.getItem(LS_FAVS)||'[]'));
function saveFavs(){try{localStorage.setItem(LS_FAVS,JSON.stringify([...FAVS]));}catch{}}
let DATASET_ID=(()=>{try{return localStorage.getItem(LS_DATASET)||null;}catch{return null;}})();
// Per-dataset freshness, written by the fetch workflow. Lets the dropdown show
// real "updated Xh ago" text and sort freshest-first, instead of a hand-typed
// label that only reflected the day someone wrote it and can silently drift.
let DATASET_STATUS={};
async function loadDatasetStatus(){
  try{const r=await fetch('./data/dataset-status.json',{cache:'no-store'});if(r.ok)DATASET_STATUS=await r.json();}catch{}
  // No saved preference yet — default to whichever dataset last updated most
  // recently, so a new set rotating in on cardkaizoku's end doesn't require
  // a code change here to stay current.
  if(!DATASET_ID){
    const withTimes=DATASETS.map(d=>({id:d.id,t:DATASET_STATUS[d.id]?.lastSuccessAt})).filter(d=>d.t);
    withTimes.sort((a,b)=>new Date(b.t)-new Date(a.t));
    DATASET_ID=withTimes[0]?.id||'west';
  }
}
function relTime(iso){
  if(!iso)return null;
  const mins=Math.max(0,(Date.now()-new Date(iso).getTime())/60000);
  if(mins<60)return Math.round(mins)+'m ago';
  const hrs=mins/60;
  if(hrs<48)return Math.round(hrs)+'h ago';
  return Math.round(hrs/24)+'d ago';
}
function sortedDatasets(){
  return [...DATASETS].sort((a,b)=>{
    const ta=DATASET_STATUS[a.id]?.lastSuccessAt, tb=DATASET_STATUS[b.id]?.lastSuccessAt;
    if(!ta&&!tb)return 0; if(!ta)return 1; if(!tb)return -1;
    return new Date(tb)-new Date(ta);
  });
}
function datasetLabel(ds){
  const stat=DATASET_STATUS[ds.id];

const REDUCE_MOTION=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function easeOutCubic(p){return 1-Math.pow(1-p,3);}
// Shared count-up used for stat readouts that change on a deliberate user
// action (picking a matchup, running Deckbuster) — never on routine
// re-renders like sorting/filtering, where it would just be noise.
function countUpEl(el,target,duration=900,decimals=1){
  if(target==null||isNaN(target)){el.textContent='—';return;}
  if(REDUCE_MOTION){el.textContent=fmt(target,decimals);return;}
  const start=performance.now();
  function tick(t){
    const p=Math.min(1,(t-start)/duration);
    el.textContent=(easeOutCubic(p)*target).toFixed(decimals)+'%';
    if(p<1)requestAnimationFrame(tick);
    else el.textContent=fmt(target,decimals);
  }
  requestAnimationFrame(tick);
}

function laDate(offset=0){
  const d=new Date(new Date().toLocaleString('en-US',{timeZone:'America/Los_Angeles'}));
  d.setDate(d.getDate()-offset);
  const s=d.toLocaleDateString('en-US',{timeZone:'America/Los_Angeles',year:'numeric',month:'2-digit',day:'2-digit'});
  const[m,dy,y]=s.split('/');return`${y}${m}${dy}`;
}
const DS=laDate(0);
function datasetPrefix(){return(DATASETS.find(d=>d.id===DATASET_ID)||DATASETS[0]).prefix;}
function buildCdnUrl(prefix,date){return`https://cdn.cardkaizoku.com/stats/${prefix}${date}.json?v=8`;}
async function fetchDataset(prefix){
  for(const date of[laDate(0),laDate(1)]){
    try{const r=await fetch(buildCdnUrl(prefix,date));if(r.ok){const j=await r.json();if(Array.isArray(j)&&j.length>0)return j;}
    }catch{}

}

const HANDS_CACHE={};
// Map dataset id to hands file id (we only cache three)
const HANDS_FILE_MAP={'op16':'op16','west_p':'west_p','west':'west_p','lw_p':'lw_p','lw':'lw_p','exreg_p':'west_p','exreg':'west_p'};
const DECKLIST_FILE_MAP={'op16':'op16','west_p':'west_p','west':'west_p','lw_p':'lw_p','lw':'lw_p','exreg_p':'west_p','exreg':'west_p'};
const DECKLIST_CACHE={};
async function loadDecklist(datasetId){
  const fileId=DECKLIST_FILE_MAP[datasetId]||'west_p';
  if(DECKLIST_CACHE[fileId])return DECKLIST_CACHE[fileId];
  try{
    const r=await fetch(`./data/stats/decklist_${fileId}.json`);
    if(r.ok){const j=await r.json();DECKLIST_CACHE[fileId]=j;return j;}
  }catch{}
  return null;
}
function parseDecklist(str){
  return (str||'').split('\n').reduce((acc,line)=>{
    const m=line.match(/^(\d+)x(.+)$/);
    if(m)acc[m[2]]=parseInt(m[1]);
    return acc;
  },{});
}
async function loadHands(datasetId){
  const fileId=HANDS_FILE_MAP[datasetId]||'west_p';
  if(HANDS_CACHE[fileId])return HANDS_CACHE[fileId];
  try{
    const r=await fetch(`./data/stats/hands_${fileId}.json`);
    if(r.ok){const j=await r.json();HANDS_CACHE[fileId]=j;return j;}
  }catch{}
  // Fallback: try CDN directly
  try{
    const ds=DATASETS.find(d=>d.id===fileId);
    if(ds){
      for(const date of[laDate(0),laDate(1)]){
        const r=await fetch(`https://cdn.cardkaizoku.com/stats/hands_${ds.period}_${date}.json?v=8`);
        if(r.ok){const j=await r.json();HANDS_CACHE[fileId]=j;return j;}
      }
    }
  }catch{}
  return null;
}

// ── DOM helper ───────────────────────────────────────────────────
function h(tag,props={},children=[]){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(props)){
    if(k==='style')Object.assign(e.style,v);
    else if(k==='class')e.className=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2).toLowerCase(),v);
    else e.setAttribute(k,v);
  }
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c==null)return;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  });
  return e;
}

// ── Meta Trends ───────────────────────────────────────────────────
// Compare pairs: current period vs last-week equivalent.
// Private-lobby pair removed — it was also the default (index 0), which is
// exactly how this ended up quietly showing non-representative data by default.
const TREND_PAIRS=[
  {label:'Standard', curr:'west', prev:'lw'},
];
let TREND_PAIR_IDX=0;

async function loadTrendDecks(datasetId){
  if(TREND_CACHE[datasetId])return TREND_CACHE[datasetId];
  try{
    const r=await fetch(`./data/stats/${datasetId}.json`,{cache:'no-store'});
    if(!r.ok)return null;
    const j=await r.json();
    const parsed=parseData(j);
    TREND_CACHE[datasetId]=parsed.decks||null;
    return parsed.decks||null;
  }catch{return null;}
}

function calcTrends(currDecks,prevDecks){
  if(!currDecks||!prevDecks)return[];
  const prevMap=new Map(prevDecks.map(d=>[d.id,d]));
  return currDecks
    .filter(d=>prevMap.has(d.id)&&d.wtdWR!=null)
    .map(d=>{
      const p=prevMap.get(d.id);
      const wrDelta=(d.wtdWR??0)-(p.wtdWR??0);
      const playDelta=(d.play??0)-(p.play??0);
      // Momentum score: WR trend weighted more heavily than play rate trend
      const momentum=wrDelta*0.7+playDelta*0.3;
      return{deck:d,wrDelta,playDelta,momentum,prevWR:p.wtdWR,prevPlay:p.play};
    });
}

function mkTrendPill(delta,suffix='%'){
  const pill=document.createElement('span');
  pill.className='trend-pill '+(delta>0.2?'up':delta<-0.2?'down':'flat');
  const abs=Math.abs(delta);
  const arrow=delta>0.2?'↑':delta<-0.2?'↓':'→';
  pill.textContent=arrow+' '+(delta>0?'+':'')+delta.toFixed(1)+suffix;
  return pill;
}

  const wrap=document.createElement('div');

  // Hero
  const hero=document.createElement('div');hero.className='trends-hero';
  const ht=document.createElement('div');ht.className='trends-hero-title';
  ht.textContent='META TRENDS';
  const pair=TREND_PAIRS[TREND_PAIR_IDX];
  const hs=document.createElement('div');hs.className='trends-hero-sub';
  hs.textContent='Win rate & play rate movement across the meta';
  const cl=document.createElement('div');cl.className='trends-compare-lbl';
  cl.textContent=`Comparing: ${pair.label} (current) vs Last Week`;
  hero.append(ht,hs,cl);wrap.appendChild(hero);

  // Sort controls — built here but appended further down, right above the
  // full table they actually affect (previously sat right under the hero,
  // above four panels they don't control, with the table they DO control
  // scrolled off-screen — looked like it wasn't working at all).
  const ctrlRow=document.createElement('div');ctrlRow.className='trends-sort-bar';
  const sl2=document.createElement('span');sl2.className='trends-sort-lbl';sl2.textContent='Sort:';
  const sortBtns=[['wr','Rising WR'],['wrFalling','Falling WR'],['play','Play Rate Δ'],['momentum','Momentum'],['absolute','Current WR']];
  sortBtns.forEach(([v,l])=>{
    const b=document.createElement('button');b.className='sort-btn'+(TREND_SORT===v?' active':'');
    b.textContent=l;b.onclick=()=>{TREND_SORT=v;render();};ctrlRow.appendChild(b);
  });
  if(TREND_PAIRS.length>1){
    const sl=document.createElement('span');sl.className='trends-sort-lbl';sl.textContent='Dataset:';

    pairSel.style.cssText='padding:6px 12px;font-size:13px;font-family:var(--font-body);font-weight:600;border:1px solid #3a4060;border-radius:8px;background:var(--card);color:var(--text)';

  // Loading state
  const loadDiv=document.createElement('div');loadDiv.className='trends-loading';
  loadDiv.textContent='Loading trend data…';wrap.appendChild(loadDiv);

  // Async: load both datasets and render
  Promise.all([loadTrendDecks(pair.curr),loadTrendDecks(pair.prev)]).then(([curr,prev])=>{
    loadDiv.remove();
    if(!curr||!prev){
      const nd=document.createElement('div');nd.className='trends-no-data';

    const trends=calcTrends(curr,prev);

      nd.textContent='No overlapping decks found between current and last-week datasets.';
      wrap.appendChild(nd);return;

      if(TREND_SORT==='play')return b.playDelta-a.playDelta;
      if(TREND_SORT==='momentum')return b.momentum-a.momentum;

    }

    const risers=[...trends].sort((a,b)=>b.wrDelta-a.wrDelta).filter(t=>t.wrDelta>0);
    const fallers=[...trends].sort((a,b)=>a.wrDelta-b.wrDelta).filter(t=>t.wrDelta<0);
    const trending=[...trends].sort((a,b)=>b.playDelta-a.playDelta).filter(t=>t.playDelta>0);
    const fading=[...trends].sort((a,b)=>a.playDelta-b.playDelta).filter(t=>t.playDelta<0);

    hlRow.appendChild(mkHighlightPanel('Rising WR','var(--g1)',risers,'wrDelta'));

    footer.textContent=`${trends.length} decks tracked · ${risers.length} rising · ${fallers.length} falling`;
    wrap.appendChild(footer);
  });

  return wrap;
}

// ── Reusable key-cards computation (used by Matchup Mastery & Experimental) ──
async function computeKeyCards(myDeckId,oppDeckId,datasetId){
  const dlData=await loadDecklist(datasetId);
  if(!dlData)return{error:'No decklist data available.'};
  const leaderEntry=dlData.find(e=>e.leader===myDeckId);
  const withMatchup=(leaderEntry?.best_decklists||[])
    .map(dl=>{const ms=dl.matchup_stats?.find(m=>m.oppLeader===oppDeckId);return ms?{...dl,vsWR:ms.win_rate,vsGames:ms.games_played}:null;})
    .filter(dl=>dl&&dl.vsGames>=10)
    .sort((a,b)=>(b.vsWR-a.vsWR)||(b.vsGames-a.vsGames));
  if(!withMatchup.length)return{error:'Insufficient matchup data to identify key cards.'};
  const scores={};
  withMatchup.slice(0,5).forEach(dl=>{
    const cards=parseDecklist(dl.decklist);
    Object.entries(cards).forEach(([id,cnt])=>{
      if(!scores[id])scores[id]={score:0,appearances:0,maxCopies:0};
      scores[id].score+=dl.vsWR*(dl.vsGames||1);
      scores[id].appearances++;
      scores[id].maxCopies=Math.max(scores[id].maxCopies,cnt);
    });
  });
  const topTotal=withMatchup.slice(0,5).length;
  const keyCards=Object.entries(scores)
    .filter(([_,v])=>v.appearances>=Math.min(2,topTotal))
    .sort((a,b)=>b[1].score-a[1].score)
    .slice(0,8);
  if(!keyCards.length)return{error:'Only one decklist found — need more data for key card analysis.'};
  return{keyCards,basedOn:withMatchup.length};
}

// ── Deckbuster algorithm ─────────────────────────────────────────
function computeDeckbuster(oppIds){
  if(!DATA||!oppIds.length)return[];
  const MIN_GAMES=10;
  const results=[];

  DATA.decks.forEach(deck=>{
    const matchupData=oppIds.map(oppId=>{
      const isMirror=oppId===deck.id;
      const mu=deck.mu?.[oppId];
      if(!mu||mu.wr==null)return{oppId,wr:null,games:0,f:null,s:null,hasData:false,isMirror};
      const gamesN=mu.n||MIN_GAMES;
      if(gamesN<MIN_GAMES)return{oppId,wr:null,games:0,f:null,s:null,hasData:false,isMirror};
      return{oppId,wr:mu.wr,games:gamesN,f:mu.f,s:mu.s,hasData:true,isMirror};
    });

    // Exclude mirror matches from the weighted average — they reflect skill not structural advantage
    const withData=matchupData.filter(m=>m.hasData&&!m.isMirror);
    if(!withData.length)return; // no data at all

    // Weighted average WR (by games in each matchup)
    const totalGames=withData.reduce((s,m)=>s+m.games,0);
    const weightedWR=withData.reduce((s,m)=>s+m.wr*m.games,0)/totalGames;

    // Coverage factor: penalise missing matchup data
    const coverage=withData.length/oppIds.length;

    // Final score: weighted WR blended with overall WR, scaled by coverage
    // 80% matchup performance, 20% overall meta standing
    const score=(weightedWR*0.8+deck.wtdWR*0.2)*coverage;

    results.push({deck,weightedWR,coverage,score,totalGames,matchupData,overallWR:deck.wtdWR});
  });

  return results.sort((a,b)=>b.score-a.score).slice(0,5);
}
