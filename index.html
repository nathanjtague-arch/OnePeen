<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meta Master: OPTCG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a;--surf:#111111;--card:#1a1a1a;--brd:#2a2a2a;
  --text:#f0f0f0;--dim:#7a8299;--acc:#e01b1b;--acc-dim:rgba(224,27,27,.15);
  --g1:#00e87a;--g2:#6ee87a;--y:#fbbf24;--o:#f97316;--r:#ef4444;--rr:#dc2626;
  --font-head:'Nunito',sans-serif;
  --font-body:'Nunito',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;line-height:1.5;
  background-image:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(224,27,27,.05),transparent);position:relative;overflow-x:hidden}
a{color:var(--acc)}
kbd{background:var(--card);border:0.5px solid var(--brd);padding:1px 6px;border-radius:3px;font-family:var(--font-mono);font-size:11px}
button,select,textarea{font-family:var(--font-body);cursor:pointer}
select{background:var(--card);color:var(--text);border:1px solid var(--brd);border-radius:8px;padding:9px 12px;font-size:13px;outline:none;width:100%;transition:border .15s}
select:hover,select:focus{border-color:var(--acc)}
textarea{font-family:var(--font-mono);resize:vertical}
input[type=checkbox]{accent-color:var(--acc);cursor:pointer;width:14px;height:14px}

/* Layout */
.wrap{max-width:1100px;margin:0 auto;padding:1.5rem 1.25rem 3rem}

/* Header */
.hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2rem;flex-wrap:wrap;gap:12px}
.hdr-title{font-family:var(--font-head);font-size:24px;font-weight:900;letter-spacing:.02em;color:var(--acc);line-height:1;transition:opacity .15s}.hdr-title:hover{opacity:.8}
.hdr-sub{font-size:11px;color:var(--dim);margin-top:4px;font-family:var(--font-mono)}
.hdr-badge{background:var(--card);border:1px solid #3a4060;border-radius:20px;padding:5px 14px;font-size:12px;color:#b0bbd8;font-family:var(--font-mono);font-weight:600}
.hdr-ds{width:auto!important;min-width:160px;font-size:12px!important;padding:5px 10px!important}


/* ═══════════════════════════════════════════════════════
   DECKBUSTER
   ═══════════════════════════════════════════════════════ */
.db-hero{text-align:center;padding:24px 0 16px}
.db-hero-title{font-family:var(--font-head);font-size:36px;font-weight:900;
  color:var(--acc);letter-spacing:.04em;
  text-shadow:0 0 30px rgba(224,27,27,.5),0 0 60px rgba(224,27,27,.2)}
.db-hero-sub{font-size:14px;color:#9aa8cc;margin-top:6px;font-weight:600}

.db-selector{display:flex;gap:8px;margin:16px 0;align-items:center;flex-wrap:wrap}
.db-selector select{flex:1;min-width:200px;padding:10px 14px;font-size:14px;
  font-family:var(--font-body);font-weight:600;
  border:1px solid #3a4060;border-radius:8px;background:var(--card);color:var(--text)}
.db-add-btn{padding:10px 20px;font-size:14px;font-weight:700;font-family:var(--font-head);
  background:rgba(224,27,27,.15);border:1px solid rgba(224,27,27,.4);border-radius:8px;
  color:var(--acc);cursor:pointer;transition:all .15s;letter-spacing:.04em;white-space:nowrap}
.db-add-btn:hover{background:rgba(224,27,27,.25);box-shadow:0 0 16px rgba(224,27,27,.3)}

.db-selected{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0;min-height:60px;
  background:rgba(255,255,255,.02);border:1px dashed #2a3050;border-radius:10px;
  padding:12px;align-items:center}
.db-empty-hint{color:#555;font-size:13px;font-style:italic;margin:auto}
.db-opp-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;
  cursor:pointer}
.db-opp-img{width:56px;height:78px;border-radius:6px;overflow:hidden;
  border:2px solid rgba(224,27,27,.4);transition:all .15s}
.db-opp-img img{width:100%;height:100%;object-fit:cover;object-position:top center;display:none}
.db-opp-img-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-size:8px;color:var(--dim);text-align:center;padding:2px}
.db-opp-remove{position:absolute;top:-6px;right:-6px;width:18px;height:18px;
  border-radius:50%;background:var(--r);color:#fff;border:none;cursor:pointer;
  font-size:11px;font-weight:900;line-height:18px;text-align:center;display:none;z-index:5}
.db-opp-card:hover .db-opp-remove{display:block}
.db-opp-card:hover .db-opp-img{border-color:var(--r)}
.db-opp-name{font-size:9px;color:#8a93b0;font-family:var(--font-mono);max-width:56px;
  text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.db-bust-row{display:flex;gap:10px;margin:16px 0;align-items:center;flex-wrap:wrap}
.db-bust-btn{flex:1;padding:16px 24px;font-size:20px;font-weight:900;
  font-family:var(--font-head);letter-spacing:.06em;
  background:linear-gradient(135deg,rgba(224,27,27,.2),rgba(200,10,10,.3));
  border:2px solid rgba(224,27,27,.6);border-radius:12px;color:#fff;
  cursor:pointer;transition:all .2s;
  box-shadow:0 0 24px rgba(224,27,27,.25),inset 0 1px 0 rgba(255,255,255,.1)}
.db-bust-btn:hover{background:linear-gradient(135deg,rgba(224,27,27,.35),rgba(200,10,10,.45));
  box-shadow:0 0 40px rgba(224,27,27,.5),inset 0 1px 0 rgba(255,255,255,.15);
  transform:translateY(-2px)}
.db-bust-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.db-clear-btn{padding:10px 16px;font-size:13px;font-weight:600;
  background:transparent;border:1px solid #3a4060;border-radius:8px;
  color:#8a93b0;cursor:pointer;transition:all .15s}
.db-clear-btn:hover{border-color:#666;color:#ccc}

.db-results{margin-top:20px}
.db-result-card{background:var(--card);border:1px solid var(--brd);border-radius:12px;
  padding:16px 20px;margin-bottom:12px;
  border-left:4px solid;transition:all .2s;
  background:linear-gradient(135deg,rgba(255,255,255,.025),rgba(255,255,255,0))}
.db-result-card:hover{box-shadow:0 8px 32px rgba(0,0,0,.4);transform:translateY(-1px)}
.db-result-header{display:flex;gap:16px;align-items:flex-start;margin-bottom:14px}
.db-result-img-wrap{width:70px;height:98px;border-radius:8px;overflow:hidden;
  flex-shrink:0;border:2px solid var(--brd)}
.db-result-img-wrap img{width:100%;height:100%;object-fit:cover;object-position:top center;display:none}
.db-result-img-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-size:8px;color:var(--dim);text-align:center;padding:4px}
.db-result-meta{flex:1}
.db-result-rank{font-family:var(--font-mono);font-size:11px;color:var(--dim);margin-bottom:4px;font-weight:600}
.db-result-name{font-size:20px;font-weight:800;font-family:var(--font-body);color:var(--text);margin-bottom:2px}
.db-result-code{font-family:var(--font-mono);font-size:11px;color:#e87070;margin-bottom:10px}
.db-result-score{font-family:var(--font-mono);font-size:28px;font-weight:700}
.db-result-score-lbl{font-size:11px;color:#8a93b0;margin-top:2px;font-weight:600}
.db-mu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:12px}
.db-mu-row{background:rgba(255,255,255,.03);border-radius:7px;padding:8px 10px;
  display:flex;align-items:center;gap:8px}
.db-mu-img{width:28px;height:39px;border-radius:3px;overflow:hidden;flex-shrink:0;background:var(--surf)}
.db-mu-img img{width:100%;height:100%;object-fit:cover;object-position:top center;display:none}
.db-mu-img-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:6px;color:var(--dim)}
.db-mu-info{flex:1;min-width:0}
.db-mu-name{font-size:9px;color:#9aa8cc;font-family:var(--font-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.db-mu-wr{font-family:var(--font-mono);font-size:14px;font-weight:700}
.db-mu-games{font-size:9px;color:#666;font-family:var(--font-mono)}
.db-coverage{font-size:12px;color:#8a93b0;margin-top:8px;font-family:var(--font-mono);font-weight:600}
.db-no-data{text-align:center;padding:40px;color:#555;font-size:14px}

/* ═══════════════════════════════════════════════════════════════
   VISUAL THEME — CDA clean + Wispr ambient
   ═══════════════════════════════════════════════════════════════ */

/* Animated ambient orbs (Wispr-inspired) */
@keyframes orb-drift {
  0%,100%{transform:translate(0,0) scale(1)}
  25%{transform:translate(40px,-30px) scale(1.08)}
  50%{transform:translate(-20px,40px) scale(0.94)}
  75%{transform:translate(30px,20px) scale(1.04)}
}
@keyframes orb-drift-r {
  0%,100%{transform:translate(0,0) scale(1)}
  25%{transform:translate(-30px,40px) scale(0.96)}
  50%{transform:translate(40px,-20px) scale(1.06)}
  75%{transform:translate(-40px,-30px) scale(0.98)}
}
.ambient-orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(90px)}
.orb-1{width:700px;height:700px;top:-250px;left:-200px;
  background:radial-gradient(circle,rgba(224,27,27,.12) 0%,transparent 70%);
  animation:orb-drift 18s ease-in-out infinite}
.orb-2{width:500px;height:500px;bottom:-100px;right:-150px;
  background:radial-gradient(circle,rgba(220,70,20,.08) 0%,transparent 70%);
  animation:orb-drift-r 22s ease-in-out infinite}
.orb-3{width:400px;height:400px;top:40%;left:50%;
  background:radial-gradient(circle,rgba(180,20,20,.05) 0%,transparent 70%);
  animation:orb-drift 28s ease-in-out infinite;animation-delay:-8s}

/* Header — premium gradient wash */
.hdr{background:linear-gradient(135deg,rgba(224,27,27,.06) 0%,rgba(10,10,10,0) 60%);
  border-bottom:1px solid rgba(224,27,27,.18);
  box-shadow:0 1px 0 rgba(224,27,27,.08)}

/* Glowing title */
@keyframes title-glow{
  0%,100%{text-shadow:0 0 20px rgba(224,27,27,.3),0 0 40px rgba(224,27,27,.1)}
  50%{text-shadow:0 0 30px rgba(224,27,27,.5),0 0 60px rgba(224,27,27,.15)}}
.hdr-title{animation:title-glow 4s ease-in-out infinite}

/* Stat cards — CDA panel style */
.stat-card{border:1px solid rgba(255,255,255,.07);
  background:linear-gradient(135deg,rgba(255,255,255,.03) 0%,rgba(255,255,255,0) 100%);
  transition:border-color .2s,box-shadow .2s,transform .2s}
.stat-card:hover{border-color:rgba(224,27,27,.45);
  box-shadow:0 0 24px rgba(224,27,27,.12),0 4px 20px rgba(0,0,0,.4);
  transform:translateY(-2px)}

/* Tabs — cleaner active state */
.tab-btn{transition:all .2s;border-bottom:2px solid transparent;font-size:15px;font-weight:800;padding:10px 22px;letter-spacing:.04em;color:#c8cfe0}
.tab-btn.active{border-bottom-color:var(--acc);
  box-shadow:0 4px 16px rgba(224,27,27,.25);
  background:rgba(224,27,27,.1)}

/* Rank rows — CDA-style clean hover */
.rank-row{transition:background .15s,border-left-color .15s}
.rank-row:hover{background:rgba(255,255,255,.035);
  box-shadow:inset 3px 0 0 rgba(224,27,27,.6)}

/* WR numbers — tier glow */
.rank-wr[style*="--g1"]{text-shadow:0 0 12px rgba(0,232,122,.4)}
.rank-wr[style*="--g2"]{text-shadow:0 0 10px rgba(110,232,122,.25)}

/* Matchup context banner */
.ctx-banner{border-radius:10px;border:1px solid rgba(255,255,255,.08);
  background:linear-gradient(135deg,rgba(255,255,255,.03),rgba(255,255,255,0));
  box-shadow:0 4px 24px rgba(0,0,0,.3);
  text-align:center;justify-content:center;flex-direction:column;align-items:center;gap:4px}

/* Advice box */
.adv-box{border-radius:12px;
  background:linear-gradient(135deg,rgba(255,255,255,.04) 0%,rgba(255,255,255,.01) 100%);
  box-shadow:0 8px 32px rgba(0,0,0,.4)}

/* Deck tiles */
.deck-tile{transition:transform .2s,box-shadow .2s}
.deck-tile:hover{transform:translateY(-3px);
  box-shadow:0 8px 32px rgba(0,0,0,.5),0 0 20px rgba(224,27,27,.1)}

/* Cards general — subtle depth */
.oh-card,.dl-card{
  background:linear-gradient(135deg,rgba(255,255,255,.025) 0%,rgba(255,255,255,0) 100%);
  border-color:rgba(255,255,255,.08);
  box-shadow:0 4px 24px rgba(0,0,0,.25)}

/* Dataset picker — styled */
.dataset-row select{
  background:linear-gradient(135deg,rgba(255,255,255,.04),rgba(255,255,255,.01));
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 2px 12px rgba(0,0,0,.3);
  transition:border-color .2s,box-shadow .2s}
.dataset-row select:focus{
  border-color:rgba(224,27,27,.5);
  box-shadow:0 0 0 3px rgba(224,27,27,.12);
  outline:none}

/* Make app content sit above orbs */
#app{position:relative;z-index:1}

/* Stats strip */
.stats-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.5rem}
.stat-card{background:var(--card);border:1px solid var(--brd);border-radius:10px;padding:12px 14px;transition:border .15s}
.stat-card:hover{border-color:rgba(224,27,27,.4)}
.stat-label{font-size:11px;font-family:var(--font-head);font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#a8b4d0;margin-bottom:5px}
.stat-val{font-size:15px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Tabs */
.tabs{display:flex;gap:6px;margin-bottom:1.25rem;flex-wrap:wrap}
.tab-btn{padding:6px 16px;border-radius:24px;font-size:12px;font-weight:600;border:1px solid var(--brd);background:transparent;color:var(--dim);letter-spacing:.03em;transition:all .15s}
.tab-btn:hover{color:var(--text);border-color:#444444}
.tab-btn.active{border-color:var(--acc);background:var(--acc-dim);color:var(--acc)}

/* Filter bar */
.filter-bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.filter-bar .label{font-size:10px;font-family:var(--font-head);font-weight:700;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.filter-btn{padding:4px 12px;border-radius:16px;font-size:11px;font-weight:500;border:1px solid var(--brd);background:transparent;color:var(--dim);transition:all .15s}
.filter-btn:hover{color:var(--text)}
.filter-btn.active{border-color:var(--acc);background:var(--acc-dim);color:var(--acc)}
.filter-count{font-size:10px;color:var(--dim);margin-left:4px}
.clear-btn{font-size:10px;color:var(--dim);background:transparent;border:1px solid var(--brd);border-radius:10px;padding:2px 8px;transition:all .15s}
.clear-btn:hover{color:var(--text);border-color:#444444}

/* Rank table */
.rank-header{display:grid;grid-template-columns:32px 48px 26px 1fr 66px 52px;gap:8px;align-items:center;padding:0 10px 8px;border-bottom:2px solid var(--brd);margin-bottom:0}
.rank-header span{font-size:10px;font-family:var(--font-head);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);cursor:pointer;user-select:none}
.rank-header span.sort-active{color:var(--acc)}
.rank-header span:hover{color:var(--text)}
.rank-row{display:grid;grid-template-columns:32px 48px 26px 1fr 66px 52px;gap:8px;align-items:center;padding:7px 10px;border-radius:0;cursor:pointer;transition:background .12s;border-left:3px solid transparent;border-bottom:1px solid rgba(255,255,255,.04)}
.rank-row:hover{background:rgba(255,255,255,.04)}
.rank-row.off{opacity:.3}
.rank-num{font-family:var(--font-mono);font-size:12px;color:#9aa8cc;text-align:right;font-weight:700}
.rank-name{font-size:15px;font-weight:700;color:var(--text);font-family:var(--font-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-code{font-family:var(--font-mono);font-size:11px;color:#e87070;margin-top:1px;font-weight:600}
.rank-wr{font-family:var(--font-mono);font-size:14px;font-weight:700;text-align:right}
.rank-play{font-family:var(--font-mono);font-size:12px;color:#c0cae0;text-align:right;font-weight:600}
/* Inline card image */
.rank-img-wrap{width:48px;height:67px;border-radius:5px;overflow:hidden;background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .12s}
.rank-img-wrap img{width:100%;height:100%;object-fit:cover;object-position:top center;display:none}
.rank-img-ph{font-family:var(--font-mono);font-size:8px;color:var(--dim);text-align:center;padding:2px;line-height:1.3}
.rank-row.off .rank-img-wrap{opacity:.35}
/* Sort bar */
.sort-bar{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.sort-lbl{font-size:12px;color:#c0c8e0;font-weight:700;font-family:var(--font-head);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.sort-btn{background:transparent;border:1px solid #3a4060;border-radius:20px;padding:4px 13px;font-size:12px;color:#b0bbd8;cursor:pointer;font-family:var(--font-body);transition:all .12s;font-weight:600}
.sort-btn.active{background:var(--acc-dim);border-color:var(--acc);color:var(--acc)}
.sort-btn:hover{color:var(--text);border-color:#555}

/* Toggle */
.tog{width:28px;height:15px;border-radius:8px;border:1px solid #3a3a3a;background:var(--surf);position:relative;flex-shrink:0;transition:all .2s}
.tog.on{background:var(--acc);border-color:var(--acc)}
.tog::after{content:'';position:absolute;top:2.5px;left:2.5px;width:8px;height:8px;border-radius:50%;background:#555555;transition:all .2s}
.tog.on::after{left:15px;background:var(--bg)}

/* Win rate bar */
.wr-bar-wrap{position:relative;flex:1;height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
.wr-bar-fill{height:100%;border-radius:3px;transition:width .3s}
.wr-bar-mid{position:absolute;left:50%;top:0;width:1px;height:100%;background:rgba(255,255,255,.12)}

/* Recalc banner */
.recalc-banner{background:rgba(224,27,27,.08);border:1px solid rgba(224,27,27,.3);border-radius:8px;padding:8px 12px;font-size:11px;color:#ff6060;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.no-recalc-banner{background:var(--card);border:1px solid var(--brd);border-radius:8px;padding:8px 12px;font-size:11px;color:#888888;margin-bottom:10px}

/* Advisor */
.adv-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:6px}
.drop-label{font-size:10px;font-family:var(--font-head);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.cb-row{display:flex;align-items:center;gap:7px;margin-top:6px;font-size:11px;color:var(--dim);cursor:pointer;user-select:none}
.cb-row:hover{color:var(--text)}
.advice-card{border-radius:12px;padding:24px 20px;text-align:center;margin:14px 0;border:1px solid var(--brd);background:var(--card);position:relative;overflow:hidden}
.advice-card::before{content:'';position:absolute;inset:0;opacity:.04;background:var(--accent-col,var(--acc));pointer-events:none}
.advice-pill{font-size:10px;font-family:var(--font-head);font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#888888;margin-bottom:10px}
.advice-text{font-family:var(--font-head);font-size:32px;font-weight:800;letter-spacing:.04em;margin-bottom:8px}
.advice-sub{font-size:12px;color:#aaaaaa;margin-bottom:5px}
.advice-src{font-size:10px;font-family:var(--font-mono);color:#8a93b0}
.mu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.mu-tile{background:var(--surf);border:1px solid var(--brd);border-radius:10px;padding:12px;text-align:center;transition:border .15s}
.mu-label{font-size:11px;font-family:var(--font-head);font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#b8c4e0;margin-bottom:5px}
.mu-val{font-family:var(--font-mono);font-size:20px;font-weight:700;margin-bottom:3px}
.mu-note{font-size:9px;color:#8a93b0;font-family:var(--font-mono)}
.deck-pair{display:grid;grid-template-columns:1fr 32px 1fr;gap:8px;align-items:center}
.deck-tile{background:var(--surf);border:1px solid var(--brd);border-radius:10px;padding:14px;text-align:center;transition:border .15s}
.deck-img-wrap{width:90px;height:126px;margin:0 auto 10px;border-radius:8px;overflow:hidden;background:var(--card);display:flex;align-items:center;justify-content:center}
.deck-img-wrap img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.deck-img-ph{font-family:var(--font-mono);font-size:10px;color:var(--dim);padding:8px;text-align:center;line-height:1.4}
.deck-tile-code{font-family:var(--font-mono);font-size:10px;color:var(--acc);margin-bottom:3px}
.deck-tile-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck-tile-wr{font-family:var(--font-mono);font-size:12px;margin-bottom:2px}
.deck-tile-play{font-size:10px;color:#9aa3c0;font-family:var(--font-mono)}
.vs-label{text-align:center;display:flex;align-items:center;justify-content:center;padding:4px;position:relative;z-index:10}.vs-label img{width:90px;height:auto;}


/* ═══════════════════════════════════════════════════════
   BATTLE ANIMATIONS
   ═══════════════════════════════════════════════════════ */

.deck-pair{position:relative;overflow:visible}

/* FAVOURABLE — My card attacks */
@keyframes my-attack{
  0%  {transform:translateX(0) scale(1) rotate(0deg);filter:brightness(1)}
  15% {transform:translateX(-12px) scale(0.93) rotate(-4deg);filter:brightness(0.85)} /* wind-up */
  45% {transform:translateX(min(260px,32vw)) scale(1.18) rotate(10deg);
       filter:brightness(1.6) drop-shadow(0 0 24px rgba(224,27,27,.9))} /* strike */
  58% {transform:translateX(min(250px,31vw)) scale(1.05) rotate(6deg);filter:brightness(1.3)}
  100%{transform:translateX(0) scale(1) rotate(0deg);filter:brightness(1)}
}
@keyframes opp-recoil{
  0%,40%{transform:translateX(0) scale(1) rotate(0deg);filter:brightness(1)}
  50%    {transform:translateX(min(40px,5vw)) scale(0.88) rotate(12deg);
          filter:brightness(2) saturate(2) drop-shadow(0 0 16px rgba(255,60,60,.8))}
  65%    {transform:translateX(min(12px,2vw)) scale(0.94) rotate(4deg)}
  100%   {transform:translateX(0) scale(1) rotate(0deg);filter:brightness(1)}
}

/* DISADVANTAGED — Opponent attacks */
@keyframes opp-attack{
  0%  {transform:translateX(0) scale(1) rotate(0deg);filter:brightness(1)}
  15% {transform:translateX(12px) scale(0.93) rotate(4deg);filter:brightness(0.85)}
  45% {transform:translateX(min(-260px,-32vw)) scale(1.18) rotate(-10deg);
       filter:brightness(1.6) drop-shadow(0 0 24px rgba(224,27,27,.9))}
  58% {transform:translateX(min(-250px,-31vw)) scale(1.05) rotate(-6deg)}
  100%{transform:translateX(0) scale(1) rotate(0deg);filter:brightness(1)}
}
@keyframes my-recoil{
  0%,40%{transform:translateX(0) scale(1) rotate(0deg);filter:brightness(1)}
  50%   {transform:translateX(min(-40px,-5vw)) scale(0.88) rotate(-12deg);
         filter:brightness(2) saturate(2) drop-shadow(0 0 16px rgba(255,60,60,.8))}
  65%   {transform:translateX(min(-12px,-2vw)) scale(0.94) rotate(-4deg)}
  100%  {transform:translateX(0) scale(1) rotate(0deg);filter:brightness(1)}
}

/* EVEN — Both clash in the middle */
@keyframes my-clash{
  0%  {transform:translateX(0) scale(1);filter:brightness(1)}
  12% {transform:translateX(-10px) scale(0.95);filter:brightness(0.9)}
  42% {transform:translateX(min(190px,24vw)) scale(1.12);
       filter:brightness(1.5) drop-shadow(0 0 18px rgba(245,208,0,.8))}
  56% {transform:translateX(min(185px,23vw)) scale(1.06)}
  100%{transform:translateX(0) scale(1);filter:brightness(1)}
}
@keyframes opp-clash{
  0%  {transform:translateX(0) scale(1);filter:brightness(1)}
  12% {transform:translateX(10px) scale(0.95);filter:brightness(0.9)}
  42% {transform:translateX(min(-190px,-24vw)) scale(1.12);
       filter:brightness(1.5) drop-shadow(0 0 18px rgba(245,208,0,.8))}
  56% {transform:translateX(min(-185px,-23vw)) scale(1.06)}
  100%{transform:translateX(0) scale(1);filter:brightness(1)}
}

/* Shockwave on deck-pair at impact */
@keyframes shockwave{
  0%,38%{transform:none}
  42%   {transform:translate(-4px,2px)}
  46%   {transform:translate(4px,-2px)}
  50%   {transform:translate(-2px,3px)}
  54%   {transform:translate(3px,-1px)}
  58%   {transform:none}
}

/* Crossed swords flash for EVEN */
@keyframes swords-flash{
  0%,35%{opacity:0;transform:translate(-50%,-50%) scale(0) rotate(-30deg)}
  45%   {opacity:1;transform:translate(-50%,-50%) scale(2.4) rotate(0deg);
         filter:drop-shadow(0 0 20px rgba(245,208,0,1)) drop-shadow(0 0 40px rgba(255,150,0,.6))}
  58%   {opacity:0.9;transform:translate(-50%,-50%) scale(2.2) rotate(8deg)}
  75%   {opacity:0;transform:translate(-50%,-50%) scale(1.4) rotate(-5deg)}
  100%  {opacity:0}
}
.clash-swords{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:64px;pointer-events:none;opacity:0;z-index:25;}


/* ─── Updated battle selectors (specific classes, not :first/:last-child) ─── */
.deck-pair[data-anim='favourable']                    {animation:shockwave 1.3s ease-out forwards}
.deck-pair[data-anim='favourable'] .deck-tile-my      {animation:my-attack  1.3s cubic-bezier(.4,0,.2,1) forwards}
.deck-pair[data-anim='favourable'] .deck-tile-opp     {animation:opp-recoil 1.3s cubic-bezier(.4,0,.2,1) forwards}
.deck-pair[data-anim='favourable'] .impact-fx         {animation:impact-burst 1.3s ease-out forwards;right:18%;left:auto}

.deck-pair[data-anim='disadvantaged']                  {animation:shockwave 1.3s ease-out forwards}
.deck-pair[data-anim='disadvantaged'] .deck-tile-my    {animation:my-recoil  1.3s cubic-bezier(.4,0,.2,1) forwards}
.deck-pair[data-anim='disadvantaged'] .deck-tile-opp   {animation:opp-attack 1.3s cubic-bezier(.4,0,.2,1) forwards}
.deck-pair[data-anim='disadvantaged'] .impact-fx       {animation:impact-burst 1.3s ease-out forwards;left:18%;right:auto}

.deck-pair[data-anim='even']                           {animation:shockwave 1.6s ease-out forwards}
.deck-pair[data-anim='even'] .deck-tile-my             {animation:my-clash   1.6s cubic-bezier(.4,0,.2,1) forwards}
.deck-pair[data-anim='even'] .deck-tile-opp            {animation:opp-clash  1.6s cubic-bezier(.4,0,.2,1) forwards}
.deck-pair[data-anim='even'] .clash-swords             {animation:swords-flash 1.6s ease-out forwards}


/* ─── Card hover zoom ─────────────────────────────────── */
.oh-item{transition:z-index 0s .25s}
.oh-item:hover{z-index:50;transition:z-index 0s}
.oh-item .oh-img-wrap{transition:transform .25s cubic-bezier(.34,1.56,.64,1),
                      box-shadow .25s ease;transform-origin:bottom center}

.dl-card-item:hover{z-index:50;transition:z-index 0s}
.dl-card-item .dl-img-wrap{transition:transform .25s cubic-bezier(.34,1.56,.64,1),
                            box-shadow .25s ease;transform-origin:bottom center}

/* Rank image */

/* Toggle button on rank row */

.rank-toggle-btn:hover.on{background:rgba(0,232,122,.1)}

/* Rank toggle dot (removed) */
.rank-img-wrap{position:relative}
.rank-toggle-dot{position:absolute;top:4px;left:4px;width:10px;height:10px;
  border-radius:50%;background:var(--g1);

/* Key cards hover zoom */
.key-card-item{position:relative;transition:z-index 0s .25s;display:flex;flex-direction:column;align-items:center;gap:4px}
.key-card-item:hover{z-index:50;transition:z-index 0s}
.key-card-item .oh-img-wrap{transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s ease;transform-origin:bottom center}
.key-card-item:hover .oh-img-wrap{
  transform:scale(2.9);
  box-shadow:0 12px 40px rgba(0,0,0,.85),0 0 20px rgba(224,27,27,.25)}

/* Manga-style impact burst */
@keyframes impact-burst{
  0%{opacity:0;transform:translate(-50%,-50%) scale(0) rotate(0deg)}
  30%{opacity:1;transform:translate(-50%,-50%) scale(1.4) rotate(20deg);
      filter:drop-shadow(0 0 16px rgba(255,220,0,1))}
  50%{opacity:0.9;transform:translate(-50%,-50%) scale(1.6) rotate(-10deg)}
  70%{opacity:0.4;transform:translate(-50%,-50%) scale(1.8) rotate(5deg)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(2) rotate(0deg)}
}
.impact-fx{
  position:absolute;top:35%;
  width:110px;height:110px;
  pointer-events:none;opacity:0;z-index:18;
  /* 8-point starburst via clip-path */
  clip-path:polygon(50% 0%,61% 35%,98% 24%,71% 50%,98% 76%,61% 65%,50% 100%,39% 65%,2% 76%,29% 50%,2% 24%,39% 35%);
  background:linear-gradient(135deg,#ffe600,#ff8c00,#ff3300);
  filter:drop-shadow(0 0 12px rgba(255,200,0,.8));
}

/* Tooltip */

<div id="tt">
  <div class="tt-img-wrap"><img class="tt-img" id="tt-img" alt=""><div class="tt-ph" id="tt-ph" style="display:none"></div></div>
  <div class="tt-name" id="tt-name"></div>
  <div class="tt-code" id="tt-code"></div>
  <div id="tt-body"></div>
</div>

<div class="wrap">
  <div class="ambient-orb orb-1"></div><div class="ambient-orb orb-2"></div><div class="ambient-orb orb-3"></div><div id="app"></div>
</div>

<script>
// ── Constants ────────────────────────────────────────────────────
const CACHE_KEY='optcg_stats_v2';
const CACHE_TTL=12*60*60*1000; // 12h
const LS_DECK='optcg_default_deck';

// ── Colour helpers ───────────────────────────────────────────────
function wrCol(v){
  if(v==null||isNaN(v))return'var(--dim)';
  if(v>=56)return'var(--g1)';if(v>=50)return'var(--g2)';
  if(v>=47)return'var(--y)';if(v>=44)return'var(--o)';if(v>=38)return'var(--r)';return'var(--rr)';
}
function asPct(v){
  if(v==null)return null;const n=parseFloat(v);if(isNaN(n))return null;
  if(n>1&&n<=100)return parseFloat(n.toFixed(3));
  if(n===0)return 0;
  return parseFloat((n*100).toFixed(3));
}
function fmt(v,d=1){return(v!=null&&!isNaN(v))?v.toFixed(d)+'%':'—';}
function fld(o,...ks){for(const k of ks)if(o!=null&&o[k]!=null)return o[k];return null;}

// ── Card image (tries 3 sources) ─────────────────────────────────
function applyCardImg(imgEl,phEl,id){
  if(!id||id==='?'){imgEl.style.display='none';if(phEl){phEl.textContent=id||'?';phEl.style.display='block';}return;}
  // Start hidden — only reveal once a URL successfully loads (avoids flash)
  imgEl.style.display='none';
  if(phEl)phEl.style.display='none';
  const set=id.split('-')[0];
  const urls=[
    `./data/cards/${id}.png`,                                                          // cached leader portraits
    `https://en.onepiece-cardgame.com/images/cardlist/card/${id}.png`,                 // Bandai official — works from any origin
    `https://limitlesstcg.nyc3.digitaloceanspaces.com/one-piece/${set}/${id}_op_en.webp`, // Limitless TCG
    `https://cdn.cardkaizoku.com/cards_en/${set}/${id}.png`,                           // cardkaizoku CDN (may be restricted)
    `https://cdn.cardkaizoku.com/cards_en/${set}/${id}_sm.webp`,                       // cardkaizoku CDN thumbnail
  ];
  let idx=0;
  function next(){
    if(idx>=urls.length){
      // All failed — show card code placeholder
      if(phEl){phEl.textContent=id;phEl.style.display='block';}
      return;
    }
    const test=new Image();
    const url=urls[idx++];
    test.onload=()=>{imgEl.src=url;imgEl.style.display='block';};
    test.onerror=()=>next();
    test.src=url;
  }
  next();
}

// ── Matchup parser ───────────────────────────────────────────────
function parseMuEntry(m){
  // Try every plausible field name for the opponent's card code
  const opp=fld(m,'leader','opponentLeader','opponent_leader','opponent','opponentId',
                  'id','cardId','leaderCode','card_code','opponentCard','opposing_leader');
  if(!opp||typeof opp!=='string')return null;
  // Win rate: pre-calculated field first, then derive from wins/total
  let wr=asPct(fld(m,'matchup_win_rate','raw_win_rate','win_rate','rawWinRate','winRate','wr','overall_win_rate'));
  if(wr==null){
    const w=parseFloat(fld(m,'wins','win_count','w')||0);
    const t=parseFloat(fld(m,'number_of_matches','total_matches','total_games','total','games','count','n')||0);
    if(t>0)wr=parseFloat(((w/t)*100).toFixed(3));
  }
  return{
    opp,wr,
    f:asPct(fld(m,'first_win_rate','firstWinRate','firstWR','first')),
    s:asPct(fld(m,'second_win_rate','secondWinRate','secondWR','second')),
    n:parseFloat(fld(m,'number_of_matches','total_games','total_matches','total','games','count','n','game_count','numGames'))||null,
  };
}

// ── Main data parser ─────────────────────────────────────────────
function parseData(json){
  const topKeys=Array.isArray(json)?['[array of '+json.length+']']:Object.keys(json).slice(0,25);
  const arr=Array.isArray(json)?json:
    (json.leaders??json.decks??json.data??json.stats??json.results??json.leaderStats??null);
  if(!arr||!Array.isArray(arr)||!arr.length)
    return{decks:null,topKeys,sampleKeys:[],sampleVals:{},firstMuEntry:null};
  const first=arr[0];
  const sampleKeys=Object.keys(first);
  const sampleVals={};
  sampleKeys.slice(0,25).forEach(k=>{
    const v=first[k];
    sampleVals[k]=typeof v==='object'&&v?'[object/array len:'+(Array.isArray(v)?v.length:'?')+']':String(v??'').slice(0,80);
  });
  const rawMuArr=fld(first,'matchups','opponents','vs','matchupData');
  const firstMuEntry=Array.isArray(rawMuArr)&&rawMuArr.length?rawMuArr[0]:null;

  const decks=arr.map(d=>{
    const rawMu=fld(d,'matchups','opponents','vs','matchupData');
    const muArr=Array.isArray(rawMu)?rawMu:null;
    const mu={};
    if(muArr)muArr.forEach(m=>{const r=parseMuEntry(m);if(r?.opp)mu[r.opp]=r;});
    return{
      id:  fld(d,'leader','id','leaderId','cardId')||'?',
      name:fld(d,'leaderName','leader_name','name','displayName')||fld(d,'leader')||'?',
      wtdWR:asPct(fld(d,'weighted_win_rate','wtdWinRate','wtd_win_rate','wwr')),
      rawWR:asPct(fld(d,'raw_win_rate','rawWinRate','winRate','win_rate')),
      play: asPct(fld(d,'play_rate','playRate','play_rate_pct','popularity')),
      games:parseFloat(fld(d,'number_of_matches','total_games','games','count','n'))||null,
      f:   asPct(fld(d,'first_win_rate','firstWinRate','firstWR','first')),
      s:   asPct(fld(d,'second_win_rate','secondWinRate','secondWR','second')),
      mu:  Object.keys(mu).length?mu:null,
    };
  }).filter(d=>d.wtdWR!=null);
  return{decks:decks.length?decks:null,topKeys,sampleKeys,sampleVals,firstMuEntry};
}

// ── Recalculation ────────────────────────────────────────────────
function calcAdjWR(deck,activeIds,allDecks){
  if(!deck.mu)return null;
  let wSum=0,wN=0;
  activeIds.forEach(oppId=>{
    if(oppId===deck.id)return;
    const mu=deck.mu[oppId];
    const opp=allDecks.find(d=>d.id===oppId);if(opp&&opp.games!=null&&opp.games<100&&EXCL_LOW)return;
    const muWR=mu?.wr??(mu?.f!=null&&mu?.s!=null?(mu.f+mu.s)/2:null);if(muWR==null||!opp?.play)return;
    wSum+=muWR*opp.play;wN+=opp.play;
  });
  return wN>0?parseFloat((wSum/wN).toFixed(3)):null;
}
function canRecalc(){
  return DATA?.decks?.some(d=>d.mu&&Object.values(d.mu).some(m=>m.wr!=null))??false;
}

// ── Advisor ──────────────────────────────────────────────────────
function getAdvice(myDeck,oppDeck){
  let f=null,s=null,src='deck average';
  const mu=myDeck.mu?.[oppDeck.id];
  if(mu?.f!=null&&mu?.s!=null){f=mu.f;s=mu.s;src='matchup-specific';}
  else if(myDeck.f!=null&&myDeck.s!=null){f=myDeck.f;s=myDeck.s;}
  if(f==null||s==null)return{text:'Insufficient data',sub:'1st/2nd WR not available',col:'var(--dim)',src:'n/a'};
  const diff=Math.abs(f-s);
  if(diff<=2)
    return{text:'Situational',sub:`Within 2% either way · ${fmt(f)} 1st · ${fmt(s)} 2nd · ${diff.toFixed(1)}% gap`,col:'var(--y)',src};
  if(f>s)return{text:'Take 1st',sub:`${fmt(f)} going first vs ${fmt(s)} going second`,col:'var(--g1)',src};
  return{text:'Take 2nd',sub:`${fmt(s)} going second vs ${fmt(f)} going first`,col:'var(--acc)',src};
}

function getMatchupCtx(wr){
  if(wr==null)return null;
  const s=fmt(wr)+' overall WR';
  if(wr>=75)return{label:'Hydrogen bomb vs Coughing Baby',sub:s,col:'var(--g1)',icon:'☢️'};
  if(wr>=60)return{label:'Heavily Favoured',sub:s,col:'var(--g1)',icon:'▲▲'};
  if(wr>=55)return{label:'Favourable matchup',sub:s,col:'var(--g2)',icon:'▲'};
  if(wr>=48)return{label:'Even matchup',sub:s,col:'var(--y)',icon:'◆'};
  if(wr>=40)return{label:'Disadvantaged matchup',sub:s,col:'var(--o)',icon:'▼'};
  if(wr>=30)return{label:'Time to lock in',sub:s,col:'var(--r)',icon:'▼▼'};
  return{label:'GG, Go next...',sub:s,col:'var(--rr)',icon:'💀'};
}

    else if(k==='class')e.className=v;

    if(c==null)return;

// ── Deckbuster algorithm ─────────────────────────────────────────
function computeDeckbuster(oppIds){
  if(!DATA||!oppIds.length)return[];
  const MIN_GAMES=10;
  const results=[];

  DATA.decks.forEach(deck=>{
    // Skip decks that are one of the selected opponents
    if(oppIds.includes(deck.id))return;

    const matchupData=oppIds.map(oppId=>{
      const mu=deck.mu?.[oppId];
      if(!mu||mu.wr==null)return{oppId,wr:null,games:0,f:null,s:null,hasData:false};
      const gamesN=mu.n||MIN_GAMES; // fall back to MIN_GAMES as weight if count unknown
      if(gamesN<MIN_GAMES)return{oppId,wr:null,games:0,f:null,s:null,hasData:false};
      return{oppId,wr:mu.wr,games:gamesN,f:mu.f,s:mu.s,hasData:true};
    });

    const withData=matchupData.filter(m=>m.hasData);
    if(!withData.length)return; // no data at all

    // Weighted average WR (by games in each matchup)
    const totalGames=withData.reduce((s,m)=>s+m.games,0);
    const weightedWR=withData.reduce((s,m)=>s+m.wr*m.games,0)/totalGames;

    // Coverage factor: penalise missing matchup data
    const coverage=withData.length/oppIds.length;

    // Final score: weighted WR blended with overall WR, scaled by coverage
    // 80% matchup performance, 20% overall meta standing
    const score=(weightedWR*0.8+deck.wtdWR*0.2)*coverage;

    results.push({deck,weightedWR,coverage,score,totalGames,matchupData,overallWR:deck.wtdWR});
  });

  return results.sort((a,b)=>b.score-a.score).slice(0,5);
}

  selLabel.style.cssText='font-size:12px;font-weight:700;color:#a0aac8;font-family:var(--font-head);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px';
  selLabel.textContent='Selected Opponents';
  wrap.appendChild(selLabel);

  const board=document.createElement('div');board.className='db-selected';
  if(!BUSTED_DECKS.length){
    const hint=document.createElement('div');hint.className='db-empty-hint';
    hint.textContent='Add decks above to build your hit list...';board.appendChild(hint);
  } else {
    BUSTED_DECKS.forEach(id=>{
      const deck=DATA.decks.find(d=>d.id===id);
      const card=document.createElement('div');card.className='db-opp-card';
      const iw=document.createElement('div');iw.className='db-opp-img';
      const im=document.createElement('img');im.alt='';
      const ph=document.createElement('div');ph.className='db-opp-img-ph';ph.textContent=id;
      iw.append(im,ph);applyCardImg(im,ph,id);
      const rm=document.createElement('button');rm.className='db-opp-remove';rm.textContent='×';
      rm.onclick=()=>{BUSTED_DECKS=BUSTED_DECKS.filter(x=>x!==id);BUST_RESULTS=null;render();};
      const nm=document.createElement('div');nm.className='db-opp-name';nm.textContent=deck?.name||id;
      card.append(iw,rm,nm);board.appendChild(card);
    });
  }
  wrap.appendChild(board);

  // Action buttons
  const btnsRow=document.createElement('div');btnsRow.className='db-bust-row';
  const bustBtn=document.createElement('button');bustBtn.className='db-bust-btn';
  bustBtn.textContent='💥 BUST THESE DECKS!';
  bustBtn.disabled=!BUSTED_DECKS.length;
  bustBtn.onclick=()=>{BUST_RESULTS=computeDeckbuster(BUSTED_DECKS);render();};
  const clearBtn=document.createElement('button');clearBtn.className='db-clear-btn';
  clearBtn.textContent='✕ Clear all';
  clearBtn.onclick=()=>{BUSTED_DECKS=[];BUST_RESULTS=null;render();};
  btnsRow.append(bustBtn,clearBtn);wrap.appendChild(btnsRow);

  // Results
  if(BUST_RESULTS){
    const resSection=document.createElement('div');resSection.className='db-results';
    if(!BUST_RESULTS.length){
      const nd=document.createElement('div');nd.className='db-no-data';
      nd.textContent='No decks found with sufficient matchup data against all selected opponents. Try fewer opponents or switch dataset.';
      resSection.appendChild(nd);
    } else {
      const rlbl=document.createElement('div');
      rlbl.style.cssText='font-size:12px;font-weight:700;color:#a0aac8;font-family:var(--font-head);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px';
      const oppNames=BUSTED_DECKS.map(id=>DATA.decks.find(d=>d.id===id)?.name||id).join(', ');
      rlbl.textContent=`Best counters vs: ${oppNames}`;
      resSection.appendChild(rlbl);

      BUST_RESULTS.forEach((r,idx)=>{
        const card=document.createElement('div');card.className='db-result-card';
        const tierCol=r.weightedWR>=60?'var(--g1)':r.weightedWR>=50?'var(--g2)':r.weightedWR>=45?'var(--y)':'var(--r)';
        card.style.borderLeftColor=tierCol;

        // Header
        const hdr=document.createElement('div');hdr.className='db-result-header';
        const iw=document.createElement('div');iw.className='db-result-img-wrap';
        iw.style.borderColor=tierCol;
        const im=document.createElement('img');im.alt='';
        const ph=document.createElement('div');ph.className='db-result-img-ph';
        iw.append(im,ph);applyCardImg(im,ph,r.deck.id);

        const meta=document.createElement('div');meta.className='db-result-meta';
        const rank=document.createElement('div');rank.className='db-result-rank';
        rank.textContent=idx===0?'🏆 TOP COUNTER':'#'+(idx+1)+' COUNTER';
        const name=document.createElement('div');name.className='db-result-name';name.textContent=r.deck.name;
        const code=document.createElement('div');code.className='db-result-code';code.textContent='['+r.deck.id+']';

        const scoreWrap=document.createElement('div');
        const score=document.createElement('div');score.className='db-result-score';
        score.style.color=tierCol;score.textContent=r.weightedWR.toFixed(1)+'%';
        const scoreLbl=document.createElement('div');scoreLbl.className='db-result-score-lbl';
        scoreLbl.textContent='combined WR vs selected opponents';
        scoreWrap.append(score,scoreLbl);

        meta.append(rank,name,code,scoreWrap);
        hdr.append(iw,meta);card.appendChild(hdr);

        // Per-opponent breakdown
        const muGrid=document.createElement('div');muGrid.className='db-mu-grid';
        r.matchupData.forEach(mu=>{
          const oppDeck=DATA.decks.find(d=>d.id===mu.oppId);
          const row=document.createElement('div');row.className='db-mu-row';
          const miw=document.createElement('div');miw.className='db-mu-img';
          const mim=document.createElement('img');mim.alt='';
          const mph=document.createElement('div');mph.className='db-mu-img-ph';mph.textContent=mu.oppId;
          miw.append(mim,mph);applyCardImg(mim,mph,mu.oppId);
          const info=document.createElement('div');info.className='db-mu-info';
          const mname=document.createElement('div');mname.className='db-mu-name';
          mname.textContent=oppDeck?.name||mu.oppId;
          const mwr=document.createElement('div');mwr.className='db-mu-wr';
          if(!mu.hasData){mwr.textContent='—';mwr.style.color='#555';}
          else{mwr.textContent=mu.wr.toFixed(1)+'%';mwr.style.color=wrCol(mu.wr);}
          const mgames=document.createElement('div');mgames.className='db-mu-games';
          mgames.textContent=mu.hasData?mu.games+' games':'no data';
          info.append(mname,mwr,mgames);
          row.append(miw,info);muGrid.appendChild(row);
        });
        card.appendChild(muGrid);

        // Coverage + overall WR note
        const cov=document.createElement('div');cov.className='db-coverage';
        cov.textContent=`Coverage: ${r.matchupData.filter(m=>m.hasData).length}/${BUSTED_DECKS.length} matchups · Overall WR: ${fmt(r.overallWR)} · ${r.totalGames.toLocaleString()} games analysed`;
        card.appendChild(cov);
        resSection.appendChild(card);
      });
    }
    wrap.appendChild(resSection);
  }
  return wrap;
}

function viewAdvisor(){
  if(!DATA?.decks)return document.createElement('div');
  const byPlay=[...DATA.decks].sort((a,b)=>(b.play||0)-(a.play||0));
  const savedDef=()=>{try{return localStorage.getItem(LS_DECK);}catch{return null;}};
  const wrap=document.createElement('div');
  const note=document.createElement('div');note.className='note';note.style.marginBottom='14px';
  note.style.color='#9aa3c0';note.textContent='Select your deck and your opponent\'s. Ordered by play rate.';
  wrap.appendChild(note);
  const grid=document.createElement('div');grid.className='adv-grid';

  function mkDropdown(lbl,current,onchange,withFavs=false){
    const dw=document.createElement('div');
    const dl=document.createElement('div');dl.className='drop-label';dl.textContent=lbl;
    const selRow=document.createElement('div');selRow.className='deck-sel-wrap';
    const sel=document.createElement('select');sel.style.flex='1';
    sel.onchange=e=>onchange(e.target.value||null);
    const blank=document.createElement('option');blank.value='';blank.textContent='— Select deck —';
    sel.appendChild(blank);
    if(withFavs){
      const favDecks=byPlay.filter(d=>FAVS.has(d.id));
      const restDecks=byPlay.filter(d=>!FAVS.has(d.id));
      if(favDecks.length>0){
        const grp=document.createElement('optgroup');grp.label='★ Favourites';
        favDecks.forEach(d=>{
          const opt=document.createElement('option');opt.value=d.id;
          opt.textContent=`★ [${d.id}] ${d.name}  (${fmt(d.play,1)} play rate)`;
          if(d.id===current)opt.selected=true;grp.appendChild(opt);
        });
        sel.appendChild(grp);
        const grp2=document.createElement('optgroup');grp2.label='All Decks';
        restDecks.forEach(d=>{
          const opt=document.createElement('option');opt.value=d.id;
          opt.textContent=`[${d.id}] ${d.name}  (${fmt(d.play,1)} play rate)`;
          if(d.id===current)opt.selected=true;grp2.appendChild(opt);
        });
        sel.appendChild(grp2);
      } else {
        byPlay.forEach(d=>{
          const opt=document.createElement('option');opt.value=d.id;
          opt.textContent=`[${d.id}] ${d.name}  (${fmt(d.play,1)} play rate)`;
          if(d.id===current)opt.selected=true;sel.appendChild(opt);
        });
      }
      // Star button to favourite/unfavourite current selection
      const starBtn=document.createElement('button');starBtn.className='fav-btn'+(FAVS.has(current||'')?' starred':'');
      starBtn.title=FAVS.has(current||'')?'Remove from favourites':'Add to favourites';
      starBtn.textContent='★';
      starBtn.onclick=()=>{
        const v=sel.value;if(!v)return;
        if(FAVS.has(v))FAVS.delete(v);else FAVS.add(v);
        saveFavs();render();
      };
      selRow.appendChild(sel);selRow.appendChild(starBtn);
    } else {
      byPlay.forEach(d=>{
        const opt=document.createElement('option');opt.value=d.id;
        opt.textContent=`[${d.id}] ${d.name}  (${fmt(d.play,1)} play rate)`;
        if(d.id===current)opt.selected=true;sel.appendChild(opt);
      });
      selRow.appendChild(sel);
    }
    dw.appendChild(dl);dw.appendChild(selRow);return dw;
  }
  const myWrap=document.createElement('div');
  myWrap.appendChild(mkDropdown('My deck',MY_DECK,v=>{MY_DECK=v;render();},true));
  // Default deck checkbox
  const isDefault=savedDef()===MY_DECK&&MY_DECK!=null;
  const cbRow=document.createElement('label');cbRow.className='cb-row';
  const cb=document.createElement('input');cb.type='checkbox';if(isDefault)cb.checked=true;
  cb.addEventListener('change',()=>{
    try{if(cb.checked&&MY_DECK)localStorage.setItem(LS_DECK,MY_DECK);else localStorage.removeItem(LS_DECK);}catch{}
    render();

  if(MY_DECK||OPP_DECK){
    loadHands(DATASET_ID).then(handsData=>{
      ohLoading.remove();
      const dual=document.createElement('div');dual.className='oh-dual';
      dual.appendChild(buildHandGrid(handsData,MY_DECK,'YOUR DECK','var(--g1)'));
      dual.appendChild(buildHandGrid(handsData,OPP_DECK,'OPPONENT','var(--r)'));
      ohCard.appendChild(dual);
      const dsNote=document.createElement('div');dsNote.className='oh-ds-note';
      dsNote.textContent='source: hands_'+(HANDS_FILE_MAP[DATASET_ID]||'west_p');
      ohCard.appendChild(dsNote);
    }).catch(()=>{ohLoading.textContent='Failed to load hand data.';});
  } else {
    ohLoading.textContent='Select decks above to see opening hand analysis.';
  }

  return wrap;
}

function viewDebug(){
  if(!DATA)return document.createElement('div');
  const wrap=document.createElement('div');
  const status=document.createElement('div');
  status.style.cssText='font-size:12px;margin-bottom:12px;padding:10px 12px;border-radius:8px;border:1px solid';
  if(DATA.decks){
    status.style.background='rgba(0,232,122,.05)';status.style.borderColor='rgba(0,232,122,.2)';status.style.color='var(--g1)';
    status.textContent=`✓ ${DATA.decks.length} decks loaded`;
  } else {
    status.style.background='rgba(239,68,68,.05)';status.style.borderColor='rgba(239,68,68,.2)';status.style.color='var(--r)';
    status.textContent='✗ Could not parse deck data — share field names below with Claude';
  }
  wrap.appendChild(status);
  const s=DATA.decks?.[0];
  if(s){
    const sec=document.createElement('div');sec.className='debug-section';
    const t=document.createElement('div');t.className='debug-title';t.textContent='Parsed values — first deck';
    sec.appendChild(t);
    const muStatus=s.mu?`✓ ${Object.keys(s.mu).length} opponents · first entry WR: ${fmt(Object.values(s.mu)[0]?.wr)}`:'null ← recalculation disabled';
    [['id',s.id],['name',s.name],['wtdWR',fmt(s.wtdWR)],['rawWR',fmt(s.rawWR)],
     ['play',fmt(s.play)],['1st WR',fmt(s.f)],['2nd WR',fmt(s.s)],
     ['games',s.games?.toLocaleString()||null],['matchups',muStatus]
    ].forEach(([k,v])=>{
      const row=document.createElement('div');row.className='debug-row';
      const key=document.createElement('span');key.className='debug-key';key.textContent=k;
      const val=document.createElement('span');
      const isNull=v==null||v==='null'||v==='—';
      val.className='debug-val'+(isNull?' null':'');val.textContent=String(v??'null');
      row.append(key,val);sec.appendChild(row);
    });
    wrap.appendChild(sec);
  }
  if(DATA.firstMuEntry){
    const sec=document.createElement('div');sec.className='debug-section';
    const t=document.createElement('div');t.className='debug-title';t.textContent='First matchup entry — raw fields (share with Claude if recalc is broken)';
    sec.appendChild(t);
    Object.entries(DATA.firstMuEntry).slice(0,15).forEach(([k,v])=>{
      const row=document.createElement('div');row.className='debug-row';
      const key=document.createElement('span');key.className='debug-key';key.textContent=k;
      const val=document.createElement('span');val.className='debug-val';
      val.textContent=typeof v==='object'?'[object]':String(v??'').slice(0,60);
      row.append(key,val);sec.appendChild(row);
    });
    wrap.appendChild(sec);
  }
  [['Top-level keys',(DATA.topKeys||[]).join(', ')],
   ['First item field names',(DATA.sampleKeys||[]).join(', ')]
  ].forEach(([title,val])=>{
    const sec=document.createElement('div');sec.className='debug-section';
    const t=document.createElement('div');t.className='debug-title';t.textContent=title;
    const v=document.createElement('div');v.className='debug-val';v.style.wordBreak='break-all';v.style.lineHeight='1.7';v.textContent=val;
    sec.append(t,v);wrap.appendChild(sec);
  });
  if(META_UPDATED){
    const n=document.createElement('div');n.className='note';n.textContent=`Data last updated: ${META_UPDATED}`;
    wrap.appendChild(n);
  }
  return wrap;
}

function loadData(json,fromCache){
  DATA=parseData(json);
  if(!fromCache)saveCache(json);
  try{if(!MY_DECK)MY_DECK=localStorage.getItem(LS_DECK)||null;}catch{}
  STATE=DATA.decks?'ok':'debug';
  HIDDEN=new Set();render();
}

  heroWrap.appendChild(heroImg);
  left.appendChild(heroWrap);
  const titleBlock=document.createElement('div');
  const title=document.createElement('div');title.className='hdr-title';title.textContent='META MASTER: OPTCG';
  title.style.cursor='pointer';title.title='Back to Rankings';
  title.onclick=()=>{TAB='rank';if(DATA){STATE='ok';}else{STATE='loading';boot();}render();};
  titleBlock.appendChild(title);
  left.appendChild(titleBlock);
  const right=document.createElement('div');right.style.cssText='display:flex;align-items:center;gap:8px;flex-wrap:wrap';
  // Dataset picker
  const dsPick=document.createElement('select');dsPick.style.cssText='width:auto;min-width:170px;font-size:12px;padding:5px 10px;border-color:var(--brd)';
  DATASETS.forEach(ds=>{const o=document.createElement('option');o.value=ds.id;o.textContent=ds.label;if(ds.id===DATASET_ID)o.selected=true;dsPick.appendChild(o);});
  dsPick.style.cssText='display:none';
  dsPick.onchange=()=>{DATASET_ID=dsPick.value;try{localStorage.setItem(LS_DATASET,DATASET_ID);}catch{}STATE='loading';DATA=null;HIDDEN=new Set();render();boot();};
  right.appendChild(dsPick);
  if(META_UPDATED){
    const b=document.createElement('div');b.className='hdr-badge';b.textContent='Updated '+META_UPDATED;right.appendChild(b);
  }
  if(false&&(STATE==='ok'||STATE==='debug')){  // Reload button hidden — data auto-updates every 6h
    const rb=document.createElement('button');rb.className='btn-ghost';rb.textContent='↻ Reload data';
    rb.onclick=()=>{STATE='paste';DATA=null;HIDDEN=new Set();MY_DECK=null;OPP_DECK=null;META_UPDATED=null;render();};
    right.appendChild(rb);
  }
  hdr.append(left,right);app.appendChild(hdr);

  if(STATE==='loading'){
    const l=document.createElement('div');l.className='loading';
    const sp=document.createElement('div');sp.className='spin';
    l.append(sp,document.createTextNode('Loading data...'));
    app.appendChild(l);return;
  }

  if(STATE==='paste'){
    const ds=DS;
    const url=buildCdnUrl(datasetPrefix(),ds);
    const card=document.createElement('div');card.className='paste-card';
    const backBtn=document.createElement('button');backBtn.className='btn-ghost';
    backBtn.textContent='← Back to Rankings';backBtn.style.cssText='margin-bottom:8px;margin-right:8px';
    backBtn.onclick=()=>{if(DATA){TAB='rank';STATE='ok';render();}else{STATE='loading';boot();render();}};
    if(DATA)card.appendChild(backBtn);
    const retryBtn=document.createElement('button');retryBtn.className='btn-ghost';
    retryBtn.textContent='↻ Try reloading data';retryBtn.style.marginBottom='12px';
    retryBtn.onclick=async()=>{
      // Force browser to bypass its cache
      try{const r=await fetch(`./data/stats/${DATASET_ID}.json`,{cache:'reload'});
        if(r.ok){const j=await r.json();if(Array.isArray(j)&&j.length>0){loadData(j,false);return;}}
      }catch{}
      STATE='loading';boot();render();
    };
    card.appendChild(retryBtn);
    const pt=document.createElement('div');pt.className='paste-title';pt.textContent='Manual Data Load';
    const step1=document.createElement('div');step1.className='paste-step';step1.textContent='1. Open this URL in a new tab:';
    const link=document.createElement('a');link.className='paste-url';link.href=url;link.target='_blank';link.textContent=url;
    const step2=document.createElement('div');step2.className='paste-step';
    step2.innerHTML='2. Press <kbd>Ctrl+A</kbd> then <kbd>Ctrl+C</kbd>';
    const step3=document.createElement('div');step3.className='paste-step';step3.textContent='3. Paste below and click Load';
    card.append(pt,step1,link,step2,step3);
    app.appendChild(card);
    const ta=document.createElement('textarea');ta.className='paste-ta';ta.id='jtxt';ta.placeholder='Paste JSON here...';
    app.appendChild(ta);
    if(PASTE_ERR){const err=document.createElement('div');err.className='paste-err';err.textContent=PASTE_ERR;app.appendChild(err);}
    const btn=document.createElement('button');btn.className='btn-primary';btn.textContent='Load Data';
    btn.onclick=()=>{
      const val=document.getElementById('jtxt')?.value.trim();
      if(!val){PASTE_ERR='Paste the JSON text first.';render();return;}
      try{const j=JSON.parse(val);PASTE_ERR='';loadData(j,false);}
      catch{PASTE_ERR='Invalid JSON — Ctrl+A then Ctrl+C from the URL tab.';render();}
    };
    app.appendChild(btn);
    const cn=document.createElement('div');cn.className='cache-note';
    cn.textContent='Once loaded, data is cached for 12 hours — no need to paste again on your next visit.';
    app.appendChild(cn);
    return;
  }

  if(DATA?.decks){
    // Stats strip
    const active=DATA.decks.filter(d=>!HIDDEN.has(d.id));
    const byWR=[...active].sort((a,b)=>(b.wtdWR||0)-(a.wtdWR||0));
    const byPlay=[...active].sort((a,b)=>(b.play||0)-(a.play||0));
    const strip=document.createElement('div');strip.className='stats-strip';
    [{l:'Best deck (wtd WR)',v:byWR[0]?`[${byWR[0].id}] ${byWR[0].name}`:'-',sub:byWR[0]?fmt(byWR[0].wtdWR)+' wtd WR':null,col:byWR[0]?wrCol(byWR[0].wtdWR):null},
     {l:'Most played',v:byPlay[0]?`[${byPlay[0].id}] ${byPlay[0].name}`:'-',sub:byPlay[0]?`${(byPlay[0].games||0).toLocaleString()} games recorded`:null,col:null},
     {l:'Active / total',v:`${active.length} / ${DATA.decks.length}`,sub:null,col:null}
    ].forEach(({l,v,sub,col})=>{
      const c=document.createElement('div');c.className='stat-card';
      const lbl=document.createElement('div');lbl.className='stat-label';lbl.textContent=l;
      const val=document.createElement('div');val.className='stat-val';val.textContent=v;
      if(col)val.style.color=col;
      c.append(lbl,val);
      if(sub){const s=document.createElement('div');s.style.cssText='font-size:11px;color:#8a93b0;font-family:var(--font-mono);margin-top:3px';s.textContent=sub;c.appendChild(s);}
      strip.appendChild(c);
    });
    app.appendChild(strip);

    // Dataset picker row (below stats strip)
    const dsPick2=document.createElement('select');
    dsPick2.style.cssText='width:100%;padding:8px 14px;font-size:14px;font-family:var(--font-body);border:1px solid var(--brd);border-radius:8px;background:var(--card);color:var(--text);margin-bottom:12px;cursor:pointer';
    DATASETS.forEach(ds=>{const o=document.createElement('option');o.value=ds.id;o.textContent=ds.label;if(ds.id===DATASET_ID)o.selected=true;dsPick2.appendChild(o);});
    dsPick2.onchange=()=>{DATASET_ID=dsPick2.value;try{localStorage.setItem(LS_DATASET,DATASET_ID);}catch{}STATE='loading';DATA=null;HIDDEN=new Set();render();boot();};
    app.appendChild(dsPick2);

    // Tabs
    const tabs=document.createElement('div');tabs.className='tabs';
    [['rank','Rankings'],['top25','Top 25 Decks'],['deckbuster','Deckbuster'],['advisor','Matchup Mastery'],['debug','Debug']].forEach(([id,l])=>{
      const b=document.createElement('button');b.className='tab-btn'+(TAB===id?' active':'');b.textContent=l;
      b.onclick=()=>{TAB=id;render();};tabs.appendChild(b);
    });
    app.appendChild(tabs);

    if(TAB==='rank'){const sf=FILTER;FILTER='all';app.appendChild(viewRank());FILTER=sf;}
    else if(TAB==='top25'){const sf=FILTER;FILTER='top25';app.appendChild(viewRank());FILTER=sf;}
    else if(TAB==='deckbuster')app.appendChild(viewDeckbuster());
    else if(TAB==='advisor')app.appendChild(viewAdvisor());
    else app.appendChild(viewDebug());
  } else if(STATE==='debug'&&DATA){
    app.appendChild(viewDebug());
  }
}

// ── Boot sequence ────────────────────────────────────────────────
render();
async function boot(){
  // Load meta timestamp if available
  try{const m=await fetch('./data/meta.json');if(m.ok){const md=await m.json();META_UPDATED=md.updated?new Date(md.updated).toLocaleString():null;}}catch{}
  // 1. Try GitHub Pages cached file for the selected dataset
  try{
    const r=await fetch(`./data/stats/${DATASET_ID}.json`,{cache:'no-store'});
    if(r.ok){const j=await r.json();if(Array.isArray(j)&&j.length>0){loadData(j,true);return;}}
  }catch{}
  // 2. Try localStorage cache
  const cached=loadCache();
  if(cached){loadData(cached,true);return;}
  // 3. Try CDN directly with selected dataset
  try{
    const j=await fetchDataset(datasetPrefix());
    if(j){loadData(j,false);return;}
  }catch{}
  // 4. Last resort: try stale localStorage regardless of expiry
  try{
    const raw=localStorage.getItem(LS_CACHE);
    if(raw){
      const {data}=JSON.parse(raw);
      if(Array.isArray(data)&&data.length>0){
        console.warn('Showing stale cached data — fresh fetch failed');
        loadData(data,true);return;
      }
    }
  }catch{}
  // 5. Try legacy stats.json (backward compat)
  try{
    const r=await fetch('./data/stats.json',{cache:'no-store'});
    if(r.ok){const j=await r.json();if(Array.isArray(j)&&j.length>0){loadData(j,false);return;}}
  }catch{}
  // 6. Paste screen only if truly nothing available
  STATE='paste';render();
}
boot();
