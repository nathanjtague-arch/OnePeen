          const mim=document.createElement('img');mim.alt='';
          const mph=document.createElement('div');mph.className='db-mu-img-ph';mph.textContent=mu.oppId;
          miw.append(mim,mph);applyCardImg(mim,mph,mu.oppId);
          const info=document.createElement('div');info.className='db-mu-info';
          const mname=document.createElement('div');mname.className='db-mu-name';
          mname.textContent=(mu.isMirror?'🪞 ':''+(oppDeck?.name||mu.oppId));
          const mwr=document.createElement('div');mwr.className='db-mu-wr';
          if(!mu.hasData){mwr.textContent='—';mwr.style.color='#555';}
          else{mwr.textContent=mu.wr.toFixed(1)+'%';mwr.style.color=wrCol(mu.wr);}
          const mgames=document.createElement('div');mgames.className='db-mu-games';
          mgames.textContent=mu.hasData?(mu.games+' games'+(mu.isMirror?' · not in score':'')):'no data';
          info.append(mname,mwr,mgames);
          row.append(miw,info);muGrid.appendChild(row);
        });
        card.appendChild(muGrid);

        // Coverage + overall WR note
        const cov=document.createElement('div');cov.className='db-coverage';
        cov.textContent=`Coverage: ${r.matchupData.filter(m=>m.hasData).length}/${BUSTED_DECKS.length} matchups · Overall WR: ${fmt(r.overallWR)} · ${r.totalGames.toLocaleString()} games analysed`;
        card.appendChild(cov);
        resSection.appendChild(card);
        // Count-up timed to land just as this card's stagger-in settles
        setTimeout(()=>countUpEl(score,r.weightedWR,900),REDUCE_MOTION?0:idx*90+150);
      });
    }
    wrap.appendChild(resSection);
  }
  return wrap;
}

function viewAdvisor(){
  if(!DATA?.decks)return document.createElement('div');
  const byPlay=[...DATA.decks].sort((a,b)=>(b.play||0)-(a.play||0));
  const savedDef=()=>{try{return localStorage.getItem(LS_DECK);}catch{return null;}};
  const wrap=document.createElement('div');
  const note=document.createElement('div');note.className='note';note.style.marginBottom='14px';
  note.style.color='#9aa3c0';note.textContent='Select your deck and your opponent\'s. Ordered by play rate.';
  wrap.appendChild(note);
  const grid=document.createElement('div');grid.className='adv-grid';

  function mkDropdown(lbl,current,onchange,withFavs=false){
    const dw=document.createElement('div');
    const dl=document.createElement('div');dl.className='drop-label';dl.textContent=lbl;
    dw.appendChild(dl);

    // Custom combobox — searchable with visible results
    const wrap=document.createElement('div');wrap.className='combo-wrap';

    const input=document.createElement('input');
    input.type='text';input.className='combo-input';
    input.placeholder='Search leaders...';
    input.autocomplete='off';

    const list=document.createElement('div');list.className='combo-list';

    // Track current selection
    let selectedId=current||null;

    // Set initial display value
    function setDisplay(id){
      selectedId=id;
      const d=byPlay.find(x=>x.id===id);
      input.value=d?`[${d.id}] ${d.name}`:'';
      input.className='combo-input'+(id?' has-value':'');
      list.classList.remove('open');
    }
    setDisplay(current||null);

    function buildList(filter=''){
      list.innerHTML='';
      const f=filter.toLowerCase();
      const matches=byPlay.filter(d=>!f||d.name.toLowerCase().includes(f)||d.id.toLowerCase().includes(f));
      if(!matches.length){
        const nm=document.createElement('div');nm.className='combo-no-results';
        nm.textContent='No leaders found';list.appendChild(nm);return;
      }
      if(withFavs){
        const favs=matches.filter(d=>FAVS.has(d.id));
        const rest=matches.filter(d=>!FAVS.has(d.id));
        if(favs.length){
          const gl=document.createElement('div');gl.className='combo-group-label';gl.textContent='★ Favourites';
          list.appendChild(gl);
          favs.forEach(d=>list.appendChild(mkItem(d,true)));
        }
        if(rest.length){
          const gl=document.createElement('div');gl.className='combo-group-label';
          gl.textContent=f?'Matching decks':'All decks';
          list.appendChild(gl);
          rest.forEach(d=>list.appendChild(mkItem(d,false)));
        }
      } else {
        matches.forEach(d=>list.appendChild(mkItem(d,false)));
      }
    }

    function mkItem(d,isFav){
      const item=document.createElement('div');
      item.className='combo-item'+(d.id===selectedId?' selected':'');
      if(isFav){const star=document.createElement('span');star.className='combo-fav-star';star.textContent='★';item.appendChild(star);}
      const code=document.createElement('span');code.className='combo-item-code';code.textContent='['+d.id+']';
      const name=document.createElement('span');name.textContent=d.name;name.style.flex='1';
      const play=document.createElement('span');play.className='combo-item-play';play.textContent=fmt(d.play,1);
      item.append(code,name,play);
      item.onmousedown=e=>{e.preventDefault();setDisplay(d.id);onchange(d.id);};
      return item;
    }

    input.onfocus=()=>{buildList('');list.classList.add('open');};  // always show full list on click
    input.oninput=()=>{buildList(input.value);list.classList.add('open');};
    input.onblur=()=>setTimeout(()=>list.classList.remove('open'),150);

    // Star button for favourites
    if(withFavs){
      const starRow=document.createElement('div');starRow.style.cssText='display:flex;gap:6px;align-items:center';
      const starBtn=document.createElement('button');starBtn.className='fav-btn'+(FAVS.has(selectedId||'')?' starred':'');
      starBtn.textContent='★';starBtn.title='Toggle favourite';
      starBtn.onclick=()=>{const v=selectedId;if(!v)return;if(FAVS.has(v))FAVS.delete(v);else FAVS.add(v);saveFavs();render();};
      wrap.append(input,list);starRow.append(wrap,starBtn);dw.appendChild(starRow);
    } else {
      wrap.append(input,list);dw.appendChild(wrap);
    }
    return dw;
  }

  const myWrap=document.createElement('div');
  myWrap.appendChild(mkDropdown('My deck',MY_DECK,v=>{MY_DECK=v;render();},true));
  // Default deck checkbox
  const isDefault=savedDef()===MY_DECK&&MY_DECK!=null;
  const cbRow=document.createElement('label');cbRow.className='cb-row';
  const cb=document.createElement('input');cb.type='checkbox';if(isDefault)cb.checked=true;
  cb.addEventListener('change',()=>{
    try{if(cb.checked&&MY_DECK)localStorage.setItem(LS_DECK,MY_DECK);else localStorage.removeItem(LS_DECK);}catch{}
    render();
  });
  cbRow.appendChild(cb);
  cbRow.appendChild(document.createTextNode(isDefault?'✓ Default deck saved':'Save as default deck'));
  myWrap.appendChild(cbRow);
  grid.appendChild(myWrap);
  grid.appendChild(mkDropdown("Opponent's deck",OPP_DECK,v=>{OPP_DECK=v;render();}));
  wrap.appendChild(grid);

  if(!MY_DECK||!OPP_DECK){
    const es=document.createElement('div');es.className='empty-state';es.style.marginTop='14px';
    es.textContent='Select both decks above to get a recommendation.';
    wrap.appendChild(es);return wrap;
  }
  if(MY_DECK===OPP_DECK){
    const es=document.createElement('div');es.className='empty-state';es.style.marginTop='14px';
    es.style.color='var(--y)';es.textContent='Mirror match selected.';
    wrap.appendChild(es);return wrap;
  }
  const myDeck=DATA.decks.find(d=>d.id===MY_DECK);
  const oppDeck=DATA.decks.find(d=>d.id===OPP_DECK);
  if(!myDeck||!oppDeck)return wrap;
  const advice=getAdvice(myDeck,oppDeck);

  // Advice banner
  const ac=document.createElement('div');ac.className='advice-card';
  ac.style.setProperty('--accent-col',advice.col);
  ac.style.borderColor=advice.col.replace('var(--','').replace(')','');
  const acBorderStyle=`1px solid ${advice.col}`;ac.style.border=acBorderStyle;
  const info=document.createElement('div');info.className='advice-info';
  const pill=document.createElement('div');pill.className='advice-pill';pill.textContent='Recommendation';
  const txt=document.createElement('div');txt.className='advice-text';txt.style.color=advice.col;txt.textContent=advice.text;
  const sub=document.createElement('div');sub.className='advice-sub';sub.textContent=advice.sub;
  info.append(pill,txt,sub);ac.appendChild(info);
  if(advice.winPct!=null){
    ac.classList.add('has-gauge');
    const gauge=document.createElement('div');gauge.className='advice-gauge';
    gauge.innerHTML=`<svg viewBox="0 0 100 100">
      <circle class="advice-gauge-track" cx="50" cy="50" r="42" fill="none" stroke-width="8"/>
      <circle class="advice-gauge-fill" cx="50" cy="50" r="42" fill="none" stroke-width="8" transform="rotate(-90 50 50)"/>
    </svg><div class="advice-gauge-num">0.0%</div>`;
    ac.appendChild(gauge);
    wrap.appendChild(ac);
    // Sweep + count up to the recommended win %, mirroring the landing
    // page's gauge — same easing, same device, now inside the actual tool.
    const fill=gauge.querySelector('.advice-gauge-fill');
    const num=gauge.querySelector('.advice-gauge-num');
    fill.style.stroke=advice.col;num.style.color=advice.col;
    const CIRC=263.9,target=advice.winPct;
    if(REDUCE_MOTION){
      fill.style.transition='none';
      fill.style.strokeDashoffset=CIRC*(1-target/100);
    }else{
      requestAnimationFrame(()=>{fill.style.strokeDashoffset=CIRC*(1-target/100);});
    }
    countUpEl(num,target,1000);
  }else{
    wrap.appendChild(ac);
  }

  // Matchup stats
  const muData=myDeck.mu?.[oppDeck.id];

  // Matchup context banner — placed after muData is defined
  {
    const ctx=getMatchupCtx(muData?.wr??null);
    if(ctx){
      const cb=document.createElement('div');cb.className='ctx-banner';
      const rgbMap={'var(--g1)':'0,232,122','var(--g2)':'110,232,122','var(--y)':'245,208,0','var(--o)':'249,115,22','var(--r)':'239,68,68','var(--rr)':'180,30,30'};
      const rgb=rgbMap[ctx.col]||'239,68,68';
      // Centered and given real presence again — the humor ("Hydrogen bomb vs
      // Coughing Baby") was always in the data, it just got visually buried
      // when this was shrunk into a small left-aligned caption. Still sized
      // and weighted below the primary recommendation (24px) so it reads as
      // the second beat, not a second headline competing with it.
      cb.style.cssText=`background:rgba(${rgb},.08);border:1px solid rgba(${rgb},.25);border-radius:10px;padding:14px 16px;margin-bottom:14px;text-align:center`;
      const lbl=document.createElement('div');lbl.className='ctx-label';
      lbl.style.cssText=`color:${ctx.col};font-size:19px;font-weight:800;font-family:var(--font-head);letter-spacing:.02em`;
      lbl.textContent=ctx.label;
      const sub=document.createElement('div');sub.style.cssText='font-size:12px;color:#8a93b0;font-family:var(--font-mono);margin-top:4px';sub.textContent=ctx.sub;
      cb.append(lbl,sub);
      wrap.appendChild(cb);
    }
  }

  const sg=document.createElement('div');sg.className='mu-grid';
  [{l:'Matchup WR',v:muData?.wr,c:wrCol(muData?.wr),n:muData?.wr!=null?'matchup-specific':'not available'},
   {l:'Win % going 1st',v:muData?.f??myDeck.f,c:wrCol(muData?.f??myDeck.f),n:muData?.f!=null?'matchup-specific':'deck average'},
   {l:'Win % going 2nd',v:muData?.s??myDeck.s,c:wrCol(muData?.s??myDeck.s),n:muData?.s!=null?'matchup-specific':'deck average'}
  ].forEach(({l,v,c,n})=>{
    const tile=document.createElement('div');tile.className='mu-tile';
    const lbl=document.createElement('div');lbl.className='mu-label';lbl.textContent=l;
    const val=document.createElement('div');val.className='mu-val';val.style.color=c;val.textContent='0.0%';
    const nt=document.createElement('div');nt.className='mu-note';nt.textContent=n;
    tile.append(lbl,val,nt);sg.appendChild(tile);
    countUpEl(val,v,900);
  });
  wrap.appendChild(sg);

  // Deck pair
  const dp=document.createElement('div');dp.className='deck-pair';
  function mkDeckTile(deck,label){
    const tile=document.createElement('div');tile.className='deck-tile';
    const lbl=document.createElement('div');lbl.className='drop-label';lbl.textContent=label;lbl.style.marginBottom='8px';
    const imgWrap=document.createElement('div');imgWrap.className='deck-img-wrap';
    const img=document.createElement('img');img.className='deck-img';
    const ph=document.createElement('div');ph.className='deck-img-ph';ph.style.display='none';
    imgWrap.appendChild(img);imgWrap.appendChild(ph);
    applyCardImg(img,ph,deck.id);
    const code=document.createElement('div');code.className='deck-tile-code';code.textContent=deck.id;
    const name=document.createElement('div');name.className='deck-tile-name';name.textContent=deck.name;
    const wr=document.createElement('div');wr.className='deck-tile-wr';wr.style.color=wrCol(deck.wtdWR);wr.textContent=fmt(deck.wtdWR)+' overall WR';
    const play=document.createElement('div');play.className='deck-tile-play';play.textContent=fmt(deck.play)+' play rate';
    tile.append(lbl,imgWrap,code,name,wr,play);return tile;
  }
  const vs=document.createElement('div');vs.className='vs-label';
  // Impact rings — the swords/starburst were replaced with a ring-burst
  // language colored by actual outcome, shared with .impact-fx below.
  const swords=document.createElement('div');swords.className='clash-swords';
  const swords2=document.createElement('div');swords2.className='clash-swords-2';
  const impactFx=document.createElement('div');impactFx.className='impact-fx';
  // Magenta, centered on the card art specifically (not the tile's full
  // height, which includes the label and stats text below the image —
  // that mismatch was what made it read as off-center).
  vs.textContent='VS';
  vs.style.cssText='font-family:var(--font-head);font-size:19px;font-weight:800;color:var(--acc);letter-spacing:.06em;'
    +'width:60px;height:60px;border-radius:50%;margin:65px auto 0;display:flex;align-items:center;justify-content:center;'
    +'background:rgba(244,0,161,.12);border:2px solid var(--acc);box-shadow:0 0 20px rgba(244,0,161,.35);position:relative;z-index:10';
  const myTile=mkDeckTile(myDeck,'My deck'); myTile.classList.add('deck-tile-my');
  const oppTile=mkDeckTile(oppDeck,'Opponent'); oppTile.classList.add('deck-tile-opp');
  dp.append(myTile,vs,oppTile,swords,swords2,impactFx);
  wrap.appendChild(dp);
  // Trigger battle animation based on matchup outcome
  if(muData?.wr!=null){
    const outcome=muData.wr>=55?'favourable':muData.wr>=48?'even':'disadvantaged';
    requestAnimationFrame(()=>{
      dp.removeAttribute('data-anim');
      void dp.offsetWidth; // force reflow so animation restarts
      dp.setAttribute('data-anim',outcome);
    });
  }

  // Opening hand guide — both decks side by side
  const ohCard=document.createElement('div');ohCard.className='oh-card';
  const ohTitle=document.createElement('div');ohTitle.className='oh-title';
  ohTitle.textContent='OPENING HAND ANALYSIS';
  const ohSub=document.createElement('div');ohSub.className='oh-subtitle';
  ohSub.textContent='Typical opening cards for each side — based on all recorded games';
  ohTitle.appendChild(ohSub);
  ohCard.appendChild(ohTitle);

  function buildHandGrid(handsData, leaderId, sideLabel, accentColor){
    const col=document.createElement('div');
    const lbl=document.createElement('div');lbl.className='oh-side-label';
    lbl.innerHTML=`${sideLabel} <span style="color:${accentColor}">[${leaderId}]</span>`;
    col.appendChild(lbl);
    if(!MY_DECK&&sideLabel==='YOUR DECK'){
      const m=document.createElement('div');m.className='oh-empty';m.textContent='Select your deck above';col.appendChild(m);return col;
    }
    if(!OPP_DECK&&sideLabel==='OPPONENT'){
      const m=document.createElement('div');m.className='oh-empty';m.textContent='Select opponent above';col.appendChild(m);return col;
    }
    if(!handsData){const m=document.createElement('div');m.className='oh-empty';m.textContent='No data';col.appendChild(m);return col;}
    const entry=handsData.find(h=>h.leader===leaderId);
    if(!entry?.common_cards?.length){const m=document.createElement('div');m.className='oh-empty';m.textContent='No hand data';col.appendChild(m);return col;}
    const grid=document.createElement('div');grid.className='oh-grid';
    entry.common_cards.slice(0,8).forEach(card=>{
      const item=document.createElement('div');item.className='oh-item';
      const iw=document.createElement('div');iw.className='oh-img-wrap';
      const im=document.createElement('img');im.alt='';
      const ph=document.createElement('div');ph.className='oh-img-ph';
      iw.append(im,ph);
      applyCardImg(im,ph,card.card);
      const rate=document.createElement('div');rate.className='oh-rate';
      rate.style.color=accentColor;
      rate.textContent=((card.appearance_rate||0)*100).toFixed(1)+'%';
      const code=document.createElement('div');code.className='oh-code';
      code.textContent=card.card;
      item.append(iw,rate,code);
      grid.appendChild(item);
    });
    col.appendChild(grid);
    return col;
  }

  const ohLoading=document.createElement('div');ohLoading.className='oh-empty';
  ohLoading.textContent='Loading hand data…';
  ohCard.appendChild(ohLoading);
  wrap.appendChild(ohCard);
  // ── Key Cards for this Matchup ─────────────────────────────────
  // Derived from decklist data: cards appearing across top-performing lists vs this opponent
  const kcCard=document.createElement('div');kcCard.className='dl-card';
  const kcTitle=document.createElement('div');kcTitle.className='dl-title';
  kcTitle.textContent='KEY CARDS FOR THIS MATCHUP';
  const kcSub=document.createElement('div');kcSub.className='dl-subtitle';
  kcSub.textContent='Cards that appear across the top-performing decklists specifically against this opponent';
  kcCard.append(kcTitle,kcSub);

  if(MY_DECK&&OPP_DECK){
    const kcLoading=document.createElement('div');kcLoading.className='dl-empty';
    kcLoading.textContent='Analysing…';kcCard.appendChild(kcLoading);
    loadDecklist(DATASET_ID).then(dlData=>{
      kcLoading.remove();
      if(!dlData){kcCard.appendChild(Object.assign(document.createElement('div'),{className:'dl-empty',textContent:'No data.'}));return;}
      const leaderEntry=dlData.find(e=>e.leader===MY_DECK);
      const withMatchup=(leaderEntry?.best_decklists||[])
        .map(dl=>{const ms=dl.matchup_stats?.find(m=>m.oppLeader===OPP_DECK);return ms?{...dl,vsWR:ms.win_rate,vsGames:ms.games_played}:null;})
        .filter(dl=>dl&&dl.vsGames>=10)
        .sort((a,b)=>(b.vsWR-a.vsWR)||(b.vsGames-a.vsGames));

      if(!withMatchup.length){
        kcCard.appendChild(Object.assign(document.createElement('div'),{className:'dl-empty',textContent:'Insufficient matchup data to identify key cards.'}));return;
      }
      // Score each card by how often it appears in top lists, weighted by that list's WR
      const scores={};
      withMatchup.slice(0,5).forEach(dl=>{
        const cards=parseDecklist(dl.decklist);
        Object.entries(cards).forEach(([id,cnt])=>{
          if(!scores[id])scores[id]={score:0,appearances:0,maxCopies:0};
          scores[id].score+=dl.vsWR*(dl.vsGames||1);
          scores[id].appearances++;
          scores[id].maxCopies=Math.max(scores[id].maxCopies,cnt);
        });
      });
      // Only show cards appearing in 2+ lists (genuine consensus), sorted by weighted score
      const topTotal=withMatchup.slice(0,5).length;
      const keyCards=Object.entries(scores)
        .filter(([_,v])=>v.appearances>=Math.min(2,topTotal))
        .sort((a,b)=>b[1].score-a[1].score)
        .slice(0,8);

      if(!keyCards.length){
        kcCard.appendChild(Object.assign(document.createElement('div'),{className:'dl-empty',textContent:'Only one decklist found — need more data for key card analysis.'}));return;
      }
      const grid=document.createElement('div');
      grid.style.cssText='display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:4px 0';
      keyCards.forEach(([id,data])=>{
        const item=document.createElement('div');item.className='key-card-item';
        const iw=document.createElement('div');iw.className='oh-img-wrap';
        const im=document.createElement('img');im.alt='';
        const ph=document.createElement('div');ph.className='oh-img-ph';
        iw.append(im,ph);applyCardImg(im,ph,id);
        const copies=document.createElement('div');
        copies.style.cssText='font-family:var(--font-mono);font-size:10px;font-weight:700;color:var(--acc);text-align:center';
        copies.textContent=`${data.maxCopies}x`;
        const code=document.createElement('div');code.className='oh-code';code.textContent=id;
        item.append(iw,copies,code);grid.appendChild(item);
      });
      kcCard.appendChild(grid);
      const note=document.createElement('div');note.className='oh-ds-note';
      note.textContent=`Based on ${withMatchup.length} decklist${withMatchup.length===1?'':'s'} with recorded games vs ${oppName}`;
      kcCard.appendChild(note);
    }).catch(()=>{});
  } else {
    kcCard.appendChild(Object.assign(document.createElement('div'),{className:'dl-empty',textContent:'Select both decks to see key cards.'}));
  }
  wrap.appendChild(kcCard);

  // ── Top Decklists vs Opponent ────────────────────────────────────
  const dlCard=document.createElement('div');dlCard.className='dl-card';
  const dlTitle=document.createElement('div');dlTitle.className='dl-title';
  dlTitle.textContent='TOP DECKLISTS VS OPPONENT';
  const dlSub=document.createElement('div');dlSub.className='dl-subtitle';
  const oppName=OPP_DECK?(DATA.decks.find(d=>d.id===OPP_DECK)?.name||OPP_DECK):'opponent';
  dlSub.textContent=`Best performing lists for [${MY_DECK||'your deck'}] specifically against ${oppName} — ranked by WR in this matchup`;
  dlCard.append(dlTitle,dlSub);

  if(MY_DECK&&OPP_DECK){
    const dlLoading=document.createElement('div');dlLoading.className='dl-empty';
    dlLoading.textContent='Loading decklist data…';dlCard.appendChild(dlLoading);
    loadDecklist(DATASET_ID).then(dlData=>{
      dlLoading.remove();
      if(!dlData){dlCard.appendChild(Object.assign(document.createElement('div'),{className:'dl-empty',textContent:'No decklist data available for this dataset.'}));return;}
      const entry=dlData.find(e=>e.leader===MY_DECK);
      if(!entry?.best_decklists?.length){dlCard.appendChild(Object.assign(document.createElement('div'),{className:'dl-empty',textContent:'No decklists found for this leader.'}));return;}

      // Filter to decklists with 50+ games vs OPP_DECK — below this threshold WR% is noise
      const MIN_GAMES=10;
      const withMatchup=entry.best_decklists
        .map(dl=>{const ms=dl.matchup_stats?.find(m=>m.oppLeader===OPP_DECK);return ms?{...dl,vsWR:ms.win_rate,vsGames:ms.games_played,vsWins:ms.wins}:null;})
        .filter(dl=>dl&&dl.vsGames>=MIN_GAMES)
        .sort((a,b)=>(b.vsWR-a.vsWR)||(b.vsGames-a.vsGames));

      if(!withMatchup.length){
        dlCard.appendChild(Object.assign(document.createElement('div'),{className:'dl-empty',textContent:`No decklists have 50+ recorded games vs ${oppName} — need 10+ games per decklist for reliable analysis for reliable analysis.`}));
        return;
      }

      withMatchup.slice(0,3).forEach((dl,idx)=>{
        const cards=parseDecklist(dl.decklist);
        // Sort: 4x first, then 3x, 2x, 1x
        const sorted=Object.entries(cards).sort((a,b)=>b[1]-a[1]);

        const entry_el=document.createElement('div');entry_el.className='dl-entry';
        const hdr=document.createElement('div');hdr.className='dl-entry-hdr';

        const wrEl=document.createElement('div');wrEl.className='dl-entry-wr';
        const wrPct=(dl.vsWR*100).toFixed(1);
        wrEl.style.color=dl.vsWR>=0.55?'var(--g1)':dl.vsWR>=0.48?'var(--y)':'var(--r)';
        wrEl.textContent=`#${idx+1} · ${wrPct}% WR vs ${oppName}`;

        const meta=document.createElement('div');meta.className='dl-entry-meta';
        meta.textContent=`${dl.vsWins}W/${dl.vsGames-dl.vsWins}L (${dl.vsGames} games) · ${dl.unique_pilots} pilot${dl.unique_pilots===1?'':'s'} · ${(dl.adj_win_rate*100).toFixed(1)}% overall adj WR`;

        hdr.append(wrEl,meta);
        entry_el.appendChild(hdr);

        const grid=document.createElement('div');grid.className='dl-cards';
        sorted.forEach(([id,count])=>{
          const set=id.split('-')[0];
          const item=document.createElement('div');item.className='dl-card-item';
          // Size by count: 4x=large, 3x=medium, 2x=small, 1x=tiny
          const sz=[0,32,38,44,50][Math.min(count,4)];
          const iw=document.createElement('div');iw.className='dl-img-wrap';
          iw.style.cssText=`width:${sz}px;height:${Math.round(sz*1.4)}px`;
          const im=document.createElement('img');im.alt='';im.style.cssText=`width:${sz}px;height:${Math.round(sz*1.4)}px`;
          const ph=document.createElement('div');ph.className='dl-img-ph';
          ph.style.cssText=`width:${sz}px;height:${Math.round(sz*1.4)}px;font-size:7px`;
          iw.append(im,ph);applyCardImg(im,ph,id);
          const cnt=document.createElement('div');cnt.className='dl-count';cnt.textContent=`${count}x`;
          item.append(iw,cnt);grid.appendChild(item);
        });
        entry_el.appendChild(grid);
        dlCard.appendChild(entry_el);
      });
    }).catch(()=>{dlCard.appendChild(Object.assign(document.createElement('div'),{className:'dl-empty',textContent:'Failed to load decklist data.'}));});
  } else {
    dlCard.appendChild(Object.assign(document.createElement('div'),{className:'dl-empty',textContent:'Select both decks to see matchup-specific decklists.'}));
  }
  wrap.appendChild(dlCard);

  if(MY_DECK||OPP_DECK){
    loadHands(DATASET_ID).then(handsData=>{
      ohLoading.remove();
      const dual=document.createElement('div');dual.className='oh-dual';
      dual.appendChild(buildHandGrid(handsData,MY_DECK,'YOUR DECK','var(--g1)'));
      dual.appendChild(buildHandGrid(handsData,OPP_DECK,'OPPONENT','var(--r)'));
      ohCard.appendChild(dual);
      const dsNote=document.createElement('div');dsNote.className='oh-ds-note';
      dsNote.textContent='source: hands_'+(HANDS_FILE_MAP[DATASET_ID]||'west_p');
      ohCard.appendChild(dsNote);
    }).catch(()=>{ohLoading.textContent='Failed to load hand data.';});
  } else {
    ohLoading.textContent='Select decks above to see opening hand analysis.';
  }

  return wrap;
}

function viewDebug(){
  if(!DATA)return document.createElement('div');
  const wrap=document.createElement('div');
  const status=document.createElement('div');
  status.style.cssText='font-size:12px;margin-bottom:12px;padding:10px 12px;border-radius:8px;border:1px solid';
  if(DATA.decks){
    status.style.background='rgba(0,232,122,.05)';status.style.borderColor='rgba(0,232,122,.2)';status.style.color='var(--g1)';
    status.textContent=`✓ ${DATA.decks.length} decks loaded`;
  } else {
    status.style.background='rgba(239,68,68,.05)';status.style.borderColor='rgba(239,68,68,.2)';status.style.color='var(--r)';
    status.textContent='✗ Could not parse deck data — share field names below with Claude';
  }
  wrap.appendChild(status);
  const s=DATA.decks?.[0];
  if(s){
    const sec=document.createElement('div');sec.className='debug-section';
    const t=document.createElement('div');t.className='debug-title';t.textContent='Parsed values — first deck';
    sec.appendChild(t);
    const muStatus=s.mu?`✓ ${Object.keys(s.mu).length} opponents · first entry WR: ${fmt(Object.values(s.mu)[0]?.wr)}`:'null ← recalculation disabled';
    [['id',s.id],['name',s.name],['wtdWR',fmt(s.wtdWR)],['rawWR',fmt(s.rawWR)],
     ['play',fmt(s.play)],['1st WR',fmt(s.f)],['2nd WR',fmt(s.s)],
     ['games',s.games?.toLocaleString()||null],['matchups',muStatus]
    ].forEach(([k,v])=>{
      const row=document.createElement('div');row.className='debug-row';
      const key=document.createElement('span');key.className='debug-key';key.textContent=k;
      const val=document.createElement('span');
      const isNull=v==null||v==='null'||v==='—';
      val.className='debug-val'+(isNull?' null':'');val.textContent=String(v??'null');
      row.append(key,val);sec.appendChild(row);
    });
    wrap.appendChild(sec);
  }
  if(DATA.firstMuEntry){
    const sec=document.createElement('div');sec.className='debug-section';
    const t=document.createElement('div');t.className='debug-title';t.textContent='First matchup entry — raw fields (share with Claude if recalc is broken)';
    sec.appendChild(t);
    Object.entries(DATA.firstMuEntry).slice(0,15).forEach(([k,v])=>{
      const row=document.createElement('div');row.className='debug-row';
      const key=document.createElement('span');key.className='debug-key';key.textContent=k;
      const val=document.createElement('span');val.className='debug-val';
      val.textContent=typeof v==='object'?'[object]':String(v??'').slice(0,60);
      row.append(key,val);sec.appendChild(row);
    });
    wrap.appendChild(sec);
  }
  [['Top-level keys',(DATA.topKeys||[]).join(', ')],
   ['First item field names',(DATA.sampleKeys||[]).join(', ')]
  ].forEach(([title,val])=>{
    const sec=document.createElement('div');sec.className='debug-section';
    const t=document.createElement('div');t.className='debug-title';t.textContent=title;
    const v=document.createElement('div');v.className='debug-val';v.style.wordBreak='break-all';v.style.lineHeight='1.7';v.textContent=val;
    sec.append(t,v);wrap.appendChild(sec);
  });
  if(META_UPDATED){
    const n=document.createElement('div');n.className='note';n.textContent=`Data last updated: ${META_UPDATED}`;
    wrap.appendChild(n);
  }
  return wrap;
}

function loadData(json,fromCache){
  DATA=parseData(json);
  if(!fromCache)saveCache(json);
  try{if(!MY_DECK)MY_DECK=localStorage.getItem(LS_DECK)||null;}catch{}
  STATE=DATA.decks?'ok':'debug';
  HIDDEN=new Set();render();
}

// ── Main render ──────────────────────────────────────────────────
function render(){
  const app=document.getElementById('app');app.innerHTML='';

  // Header
  const hdr=document.createElement('div');hdr.className='hdr';
  const left=document.createElement('div');left.style.cssText='display:flex;align-items:center;gap:12px';
  // Clean mark — simplified straw-hat silhouette, replaces the old character artwork
  const heroWrap=document.createElement('div');heroWrap.style.cssText='width:40px;height:40px;border-radius:8px;overflow:hidden;flex-shrink:0;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer';
  heroWrap.title='Back to Rankings';
  heroWrap.onclick=()=>{TAB='rank';if(DATA){STATE='ok';}else{STATE='loading';boot();}render();};
  heroWrap.innerHTML='<svg width="32" height="32" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><ellipse cx="50" cy="70" rx="40" ry="9" fill="#F2C94C"/><path d="M28,70 Q28,34 50,34 Q72,34 72,70 Z" fill="#F2C94C"/><rect x="28" y="62" width="44" height="7" fill="#F400A1"/></svg>';
  left.appendChild(heroWrap);
  const titleBlock=document.createElement('div');
  const title=document.createElement('div');title.className='hdr-title';title.textContent='META MASTER: OPTCG';
  title.style.cursor='pointer';title.title='Back to Rankings';
  title.onclick=()=>{TAB='rank';if(DATA){STATE='ok';}else{STATE='loading';boot();}render();};
  titleBlock.appendChild(title);
  left.appendChild(titleBlock);
  const right=document.createElement('div');right.style.cssText='display:flex;align-items:center;gap:8px;flex-wrap:wrap';
  // Dataset picker
  const dsPick=document.createElement('select');dsPick.style.cssText='width:auto;min-width:170px;font-size:12px;padding:5px 10px;border:1px solid rgba(255,255,255,.1);border-radius:4px;background:#111;color:#c8d0e8';
  populateDatasetSelect(dsPick);
  dsPick.style.cssText='display:none';
  dsPick.onchange=()=>{DATASET_ID=dsPick.value;try{localStorage.setItem(LS_DATASET,DATASET_ID);}catch{}STATE='loading';DATA=null;HIDDEN=new Set();render();boot();};
  right.appendChild(dsPick);
  if(META_UPDATED){
    const b=document.createElement('div');b.className='hdr-badge';b.textContent='Updated '+META_UPDATED;right.appendChild(b);
  }
  if(false&&(STATE==='ok'||STATE==='debug')){  // Reload button hidden — data auto-updates every 6h
    const rb=document.createElement('button');rb.className='btn-ghost';rb.textContent='↻ Reload data';
    rb.onclick=()=>{STATE='paste';DATA=null;HIDDEN=new Set();MY_DECK=null;OPP_DECK=null;META_UPDATED=null;render();};
    right.appendChild(rb);
  }
  hdr.append(left,right);app.appendChild(hdr);

  if(STATE==='loading'){
    const l=document.createElement('div');l.className='loading';
    const sp=document.createElement('div');sp.className='spin';
    l.append(sp,document.createTextNode('Loading data...'));
    app.appendChild(l);return;
  }

  if(STATE==='paste'){
    const ds=DS;
    const url=buildCdnUrl(datasetPrefix(),ds);
    const card=document.createElement('div');card.className='paste-card';
    const backBtn=document.createElement('button');backBtn.className='btn-ghost';
    backBtn.textContent='← Back to Rankings';backBtn.style.cssText='margin-bottom:8px;margin-right:8px';
    backBtn.onclick=()=>{if(DATA){TAB='rank';STATE='ok';render();}else{STATE='loading';boot();render();}};
    if(DATA)card.appendChild(backBtn);
    const retryBtn=document.createElement('button');retryBtn.className='btn-ghost';
    retryBtn.textContent='↻ Try reloading data';retryBtn.style.marginBottom='12px';
    retryBtn.onclick=async()=>{
      // Force browser to bypass its cache
      try{const r=await fetch(`./data/stats/${DATASET_ID}.json`,{cache:'reload'});
        if(r.ok){const j=await r.json();if(Array.isArray(j)&&j.length>0){loadData(j,false);return;}}
      }catch{}
      STATE='loading';boot();render();
    };
    card.appendChild(retryBtn);
    const pt=document.createElement('div');pt.className='paste-title';pt.textContent='Manual Data Load';
    const step1=document.createElement('div');step1.className='paste-step';step1.textContent='1. Open this URL in a new tab:';
    const link=document.createElement('a');link.className='paste-url';link.href=url;link.target='_blank';link.textContent=url;
    const step2=document.createElement('div');step2.className='paste-step';
    step2.innerHTML='2. Press <kbd>Ctrl+A</kbd> then <kbd>Ctrl+C</kbd>';
    const step3=document.createElement('div');step3.className='paste-step';step3.textContent='3. Paste below and click Load';
    card.append(pt,step1,link,step2,step3);
    app.appendChild(card);
    const ta=document.createElement('textarea');ta.className='paste-ta';ta.id='jtxt';ta.placeholder='Paste JSON here...';
    app.appendChild(ta);
    if(PASTE_ERR){const err=document.createElement('div');err.className='paste-err';err.textContent=PASTE_ERR;app.appendChild(err);}
    const btn=document.createElement('button');btn.className='btn-primary';btn.textContent='Load Data';
    btn.onclick=()=>{
      const val=document.getElementById('jtxt')?.value.trim();
      if(!val){PASTE_ERR='Paste the JSON text first.';render();return;}
      try{const j=JSON.parse(val);PASTE_ERR='';loadData(j,false);}
      catch{PASTE_ERR='Invalid JSON — Ctrl+A then Ctrl+C from the URL tab.';render();}
    };
    app.appendChild(btn);
    const cn=document.createElement('div');cn.className='cache-note';
    cn.textContent='Once loaded, data is cached for 12 hours — no need to paste again on your next visit.';
    app.appendChild(cn);
    return;
  }

  if(DATA?.decks){
    // Stats strip
    const active=DATA.decks.filter(d=>!HIDDEN.has(d.id));
    const byWR=[...active].sort((a,b)=>(b.wtdWR||0)-(a.wtdWR||0));
    const byPlay=[...active].sort((a,b)=>(b.play||0)-(a.play||0));
    const strip=document.createElement('div');strip.className='stats-strip';
    [{l:'Best deck (wtd WR)',v:byWR[0]?`[${byWR[0].id}] ${byWR[0].name}`:'-',sub:byWR[0]?fmt(byWR[0].wtdWR)+' wtd WR':null,col:byWR[0]?wrCol(byWR[0].wtdWR):null},
     {l:'Most played',v:byPlay[0]?`[${byPlay[0].id}] ${byPlay[0].name}`:'-',sub:byPlay[0]?`${(byPlay[0].games||0).toLocaleString()} games recorded`:null,col:null},
     {l:'Active / total',v:`${active.length} / ${DATA.decks.length}`,sub:null,col:null}
    ].forEach(({l,v,sub,col})=>{
      const c=document.createElement('div');c.className='stat-card';
      const lbl=document.createElement('div');lbl.className='stat-label';lbl.textContent=l;
      const val=document.createElement('div');val.className='stat-val';val.textContent=v;
      if(col)val.style.color=col;
      c.append(lbl,val);
      if(sub){const s=document.createElement('div');s.style.cssText='font-size:11px;color:#8a93b0;font-family:var(--font-mono);margin-top:3px';s.textContent=sub;c.appendChild(s);}
      strip.appendChild(c);
    });
    app.appendChild(strip);

    // Dataset picker row (below stats strip)
    const dsPick2=document.createElement('select');
    dsPick2.style.cssText='width:100%;padding:10px 14px;font-size:13px;font-family:var(--font-body);font-weight:600;border:1px solid rgba(255,255,255,.1);border-radius:4px;background:#111;color:#c8d0e8;margin-bottom:16px;cursor:pointer;outline:none';
    populateDatasetSelect(dsPick2);
    dsPick2.onchange=()=>{DATASET_ID=dsPick2.value;try{localStorage.setItem(LS_DATASET,DATASET_ID);}catch{}STATE='loading';DATA=null;HIDDEN=new Set();render();boot();};
    app.appendChild(dsPick2);

    // Tabs
    const tabs=document.createElement('div');tabs.className='tabs';
    [['rank','Rankings'],['top25','Top 25 Decks'],['trends','Meta Trends'],['deckbuster','Deckbuster'],['advisor','Matchup Mastery'],['experimental','Experimental'],['debug','Debug']].forEach(([id,l])=>{
      const b=document.createElement('button');b.className='tab-btn'+(TAB===id?' active':'');b.textContent=l;
      b.onclick=()=>{TAB=id;render();};tabs.appendChild(b);
    });
    app.appendChild(tabs);

    if(TAB==='rank'){const sf=FILTER;FILTER='all';app.appendChild(viewRank());FILTER=sf;}
    else if(TAB==='top25'){const sf=FILTER;FILTER='top25';app.appendChild(viewRank());FILTER=sf;}
    else if(TAB==='trends')app.appendChild(viewTrends());
    else if(TAB==='experimental')app.appendChild(viewExperimental());
    else if(TAB==='deckbuster')app.appendChild(viewDeckbuster());
    else if(TAB==='advisor')app.appendChild(viewAdvisor());
    else app.appendChild(viewDebug());
  } else if(STATE==='debug'&&DATA){
    app.appendChild(viewDebug());
  }
}

// ── Boot sequence ────────────────────────────────────────────────
render();
async function boot(){
  await loadDatasetStatus();
  // Load meta timestamp if available
  try{const m=await fetch('./data/meta.json');if(m.ok){const md=await m.json();META_UPDATED=md.updated?new Date(md.updated).toLocaleString():null;}}catch{}
  // 1. Try GitHub Pages cached file for the selected dataset
  try{
    const r=await fetch(`./data/stats/${DATASET_ID}.json`,{cache:'no-store'});
    if(r.ok){const j=await r.json();if(Array.isArray(j)&&j.length>0){loadData(j,true);return;}}
  }catch{}
  // 2. Try localStorage cache
  const cached=loadCache();
  if(cached){loadData(cached,true);return;}
  // 3. Try CDN directly with selected dataset
  try{
    const j=await fetchDataset(datasetPrefix());
    if(j){loadData(j,false);return;}
  }catch{}
  // 4. Last resort: try stale localStorage regardless of expiry
  try{
    const raw=localStorage.getItem(LS_CACHE);
    if(raw){
      const {data}=JSON.parse(raw);
      if(Array.isArray(data)&&data.length>0){
        console.warn('Showing stale cached data — fresh fetch failed');
        loadData(data,true);return;
      }
    }
  }catch{}
  // 5. Try legacy stats.json (backward compat)
  try{
    const r=await fetch('./data/stats.json',{cache:'no-store'});
    if(r.ok){const j=await r.json();if(Array.isArray(j)&&j.length>0){loadData(j,false);return;}}
  }catch{}
  // 6. Paste screen only if truly nothing available
  STATE='paste';render();
}
boot();
</script>
