name: Update OPTCG Stats Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + Chromium
        run: |
          cd /tmp
          npm init -y > /dev/null
          npm install playwright > /dev/null 2>&1
          npx playwright install chromium --with-deps > /dev/null 2>&1
          echo "Playwright ready"

      - name: Fetch stats via browser interception
        run: |
          mkdir -p data
          node .github/fetch-stats.js

      - name: Validate and finalise
        run: |
          mkdir -p data
          if [ -f data/stats.json ] && [ -s data/stats.json ]; then
            COUNT=$(python3 -c "import json; d=json.load(open('data/stats.json')); print(len(d) if isinstance(d,list) else 'object')" 2>/dev/null || echo "unknown")
            echo "stats.json valid — $COUNT entries"
          else
            echo "No stats.json produced — skipping commit"
          fi
          touch data/.nojekyll
          echo "{\"updated\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > data/meta.json

      - name: Ensure .nojekyll exists at root
        run: touch .nojekyll

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ .nojekyll
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update stats $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
