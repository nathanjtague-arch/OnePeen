name: Update OPTCG Stats Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright + Chromium
        run: |
          cd /tmp && npm init -y > /dev/null
          npm install playwright > /dev/null 2>&1
          npx playwright install chromium --with-deps > /dev/null 2>&1
          echo "Playwright ready"

      - name: Fetch stats
        env:
          CARDKAIZOKU_COOKIES: ${{ secrets.CARDKAIZOKU_COOKIES }}
        run: |
          mkdir -p data/stats data/cards
          node .github/fetch-stats.js

      - name: Validate and write metadata
        run: |
          FILES=$(ls data/stats/*.json 2>/dev/null | wc -l)
          echo "Dataset files written: $FILES"
          echo "{\"updated\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > data/meta.json
          touch .nojekyll

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ .nojekyll
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update stats $(date -u +'%Y-%m-%d %H:%M UTC')"
            # Pull any changes that landed on main since this run started —
            # e.g. someone uploading a file through the GitHub website at
            # the same moment this scheduled run is trying to push — before
            # pushing, and retry a few times if two writers genuinely
            # collide. This is the fix for the "fetch first" push rejection.
            PUSHED=false
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then
                PUSHED=true
                break
              fi
              echo "Push attempt $i failed — pulling and retrying"
              sleep 5
            done
            if [ "$PUSHED" = false ]; then
              echo "::warning::Could not push stats update after 3 attempts — will retry on the next scheduled run"
            fi
          fi
