name: Update OPTCG Stats Data

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # ← KEY FIX: allows the job to commit and push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch stats data
        run: |
          TODAY=$(date +%Y%m%d)
          YESTERDAY=$(date -d "yesterday" +%Y%m%d)
          mkdir -p data
          SET="op16"

          fetch_stats() {
            local DATE=$1
            local VERSION=$2
            local URL="https://cdn.cardkaizoku.com/stats/stats_${SET}_${DATE}.json?v=${VERSION}"
            echo "Trying: $URL"
            curl -L --fail --silent --max-time 15 \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
              -H "Accept: application/json, text/plain, */*" \
              -H "Accept-Language: en-US,en;q=0.9" \
              -H "Referer: https://www.cardkaizoku.com/matchups" \
              -H "Origin: https://www.cardkaizoku.com" \
              -o data/stats.json "$URL"
          }

          SUCCESS=false
          for DATE in $TODAY $YESTERDAY; do
            for VER in 8 9 7 10 6 11 5; do
              if fetch_stats $DATE $VER && [ -s data/stats.json ]; then
                echo "✓ Fetched stats for $DATE (v=$VER)"
                SUCCESS=true
                break 2
              fi
            done
          done

          if [ "$SUCCESS" = false ]; then
            echo "✗ Could not fetch stats — keeping existing file"
            exit 0
          fi

          if ! python3 -c "import json,sys; json.load(open('data/stats.json'))" 2>/dev/null; then
            echo "✗ Response is not valid JSON — discarding"
            git checkout -- data/stats.json 2>/dev/null || rm -f data/stats.json
            exit 0
          fi

          echo "Stats file: $(wc -c < data/stats.json) bytes"

      - name: Fetch hands data
        run: |
          TODAY=$(date +%Y%m%d)
          YESTERDAY=$(date -d "yesterday" +%Y%m%d)
          mkdir -p data
          SET="op16"
          for DATE in $TODAY $YESTERDAY; do
            for VER in 8 9 7 10 6 5; do
              URL="https://cdn.cardkaizoku.com/stats/hands_${SET}_${DATE}.json?v=${VER}"
              if curl -L --fail --silent --max-time 15 \
                -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
                -H "Referer: https://www.cardkaizoku.com/" \
                -o data/hands.json "$URL" && [ -s data/hands.json ]; then
                echo "✓ Fetched hands data for $DATE (v=$VER)"
                break 2
              fi
            done
          done

      - name: Write metadata
        run: |
          echo "{\"updated\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"date\":\"$(date +%Y%m%d)\"}" > data/meta.json

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update stats $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
