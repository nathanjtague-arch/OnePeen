name: Update OPTCG Stats Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch stats
        run: |
          mkdir -p data/stats data/cards
          node .github/fetch-stats.js

      - name: Validate
        run: |
          COUNT=$(python3 -c "
          import os, json
          total = 0
          for f in os.listdir('data/stats'):
              if f.endswith('.json'):
                  d = json.load(open(f'data/stats/{f}'))
                  total += len(d) if isinstance(d, list) else 1
          print(total)
          " 2>/dev/null || echo "0")
          echo "Total records across all datasets: $COUNT"
          echo "{\"updated\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > data/meta.json
          touch .nojekyll

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ .nojekyll
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update stats $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
